<!doctype html>
<html>
    <head>
        <meta charset="utf-8" />
        <style>
            /* Today's Daily Pot at its cap, with the podium still empty. /api/pot, 15 Oct 2026 08:36 UTC: 4.127 SOL of
               the day's creator fees reached the treasury, so the pot (40%, at most 1 SOL) is at the 1 SOL cap: 0.6 SOL
               for the top 10 places, weighted 30/20/14/10/8/6/4/3/3/2 (#1 0.18, #2 0.12, #3 0.084 SOL), and 0.4 SOL
               shared by everyone who clears the bounty (Cope and Hold: survive to 15:00). Paid in $ANSEM bought with
               that SOL after 00:10 UTC; only verified runs with a Solana address on the receipt are paid. The
               candles are the game's own sprites; the podium and the meter are drawn here.
               ?d=<json> { date, places: [first, second, third], bounty }. */
            @font-face {
                font-family: 'Jersey 10';
                src: url('/hq/assets/fonts/jersey-10.woff2') format('woff2');
            }
            @font-face {
                font-family: 'JetBrains Mono';
                src: url('/hq/assets/fonts/jetbrains-mono-400.woff2') format('woff2');
            }
            * {
                box-sizing: border-box;
            }
            html,
            body {
                margin: 0;
                width: 1200px;
                height: 1500px;
                overflow: hidden;
                background: #05080f;
                color: #f4f8fb;
                font-family: 'Jersey 10', monospace;
            }
            canvas {
                image-rendering: pixelated;
            }
            .bg {
                position: absolute;
                inset: 0;
                background:
                    radial-gradient(
                        ellipse 58% 26% at 50% 25%,
                        rgba(245, 197, 66, 0.3),
                        transparent 72%
                    ),
                    radial-gradient(
                        ellipse 70% 30% at 50% 82%,
                        rgba(22, 224, 138, 0.16),
                        transparent 70%
                    ),
                    linear-gradient(180deg, #0d1424, #05080f 70%);
            }
            #rain {
                position: absolute;
                inset: 0;
            }
            .top {
                position: absolute;
                left: 64px;
                right: 64px;
                top: 60px;
                height: 72px;
                display: flex;
                align-items: center;
                justify-content: space-between;
            }
            .brand {
                display: flex;
                align-items: center;
                gap: 18px;
                font-size: 66px;
                line-height: 1;
                letter-spacing: 0.04em;
            }
            .pill {
                padding: 2px 24px 4px;
                background: #16e08a;
                color: #05080f;
                font-size: 56px;
                line-height: 1.1;
                letter-spacing: 0.05em;
                box-shadow:
                    0 0 0 4px #05080f,
                    0 0 0 8px #16e08a,
                    0 0 40px rgba(22, 224, 138, 0.5);
            }
            .kick {
                position: absolute;
                left: 0;
                right: 0;
                top: 178px;
                text-align: center;
                font:
                    400 34px/1 'JetBrains Mono',
                    monospace;
                letter-spacing: 0.42em;
                color: #f5c542;
            }
            .big {
                position: absolute;
                left: 0;
                right: 0;
                top: 214px;
                text-align: center;
                font-size: 360px;
                line-height: 0.84;
                letter-spacing: 0.01em;
                color: #f5c542;
                text-shadow:
                    0 12px 0 #8a5f0e,
                    0 22px 0 #3a2a08,
                    0 0 90px rgba(245, 197, 66, 0.55);
            }
            .meter {
                position: absolute;
                left: 110px;
                right: 110px;
                top: 572px;
                height: 78px;
                padding: 10px;
                background: #05080f;
                box-shadow:
                    0 0 0 5px #f4f8fb,
                    0 0 0 10px #05080f,
                    0 0 50px rgba(22, 224, 138, 0.35);
            }
            .meter .fill {
                height: 100%;
                background:
                    repeating-linear-gradient(
                        90deg,
                        transparent 0 46px,
                        rgba(5, 8, 15, 0.55) 46px 52px
                    ),
                    linear-gradient(180deg, #9dffd2, #16e08a 50%, #0b8f56);
            }
            .stamp {
                position: absolute;
                right: 70px;
                top: 528px;
                padding: 4px 26px 10px;
                transform: rotate(-9deg);
                background: #ff3b5c;
                color: #f4f8fb;
                font-size: 104px;
                line-height: 1;
                letter-spacing: 0.06em;
                box-shadow:
                    0 0 0 6px #05080f,
                    12px 14px 0 rgba(0, 0, 0, 0.5);
            }
            .pod {
                position: absolute;
                bottom: 250px;
                width: 330px;
                text-align: center;
            }
            .pod .q {
                font-size: 124px;
                line-height: 1;
                color: rgba(244, 248, 251, 0.9);
                text-shadow: 0 0 40px rgba(244, 248, 251, 0.35);
            }
            .pod .blk {
                position: relative;
                margin-top: 14px;
                padding-top: 30px;
                box-shadow:
                    inset 0 0 0 6px #05080f,
                    0 0 0 4px #05080f;
            }
            .pod .blk::before {
                content: '';
                position: absolute;
                left: 0;
                right: 0;
                top: 0;
                height: 22px;
                background: rgba(255, 255, 255, 0.3);
            }
            .pod .rk {
                font-size: 100px;
                line-height: 0.9;
                color: #05080f;
            }
            .pod .amt {
                margin-top: 6px;
                font-size: 76px;
                line-height: 1;
                color: #05080f;
            }
            #p1 {
                left: 435px;
            }
            #p1 .blk {
                height: 300px;
                background: linear-gradient(180deg, #ffe58a, #f5c542 40%, #c8961e);
            }
            #p2 {
                left: 95px;
            }
            #p2 .blk {
                height: 250px;
                background: linear-gradient(180deg, #ffffff, #c9d3df 45%, #8a97a5);
            }
            #p3 {
                left: 775px;
            }
            #p3 .blk {
                height: 212px;
                background: linear-gradient(180deg, #ffc28a, #d98a4a 45%, #8f5223);
            }
            #crown {
                display: block;
                margin: 0 auto -18px;
                filter: drop-shadow(0 0 30px rgba(245, 197, 66, 0.7));
            }
            .floor {
                position: absolute;
                left: 60px;
                right: 60px;
                top: 1246px;
                height: 8px;
                background: #f4f8fb;
                box-shadow: 0 0 30px rgba(244, 248, 251, 0.4);
            }
            .more {
                position: absolute;
                left: 0;
                right: 0;
                top: 1282px;
                text-align: center;
                font-size: 70px;
                line-height: 1;
            }
            .more b {
                font-weight: 400;
                color: #16e08a;
            }
            .small {
                position: absolute;
                left: 0;
                right: 0;
                top: 1406px;
                text-align: center;
                font:
                    400 23px/1 'JetBrains Mono',
                    monospace;
                letter-spacing: 0.14em;
                color: #b8c4d2;
            }
        </style>
    </head>
    <body>
        <div class="bg"></div>
        <canvas id="rain" width="1200" height="1500"></canvas>
        <div class="top">
            <div class="brand"><canvas id="mark"></canvas>BEARPROOF</div>
            <div class="pill" id="pill"></div>
        </div>
        <div class="kick">TODAY'S PRIZE POT</div>
        <div class="big">1 SOL</div>
        <div class="meter"><div class="fill"></div></div>
        <div class="stamp">MAXED</div>
        <div class="pod" id="p2">
            <div class="q">?</div>
            <div class="blk">
                <div class="rk">2</div>
                <div class="amt" id="a2"></div>
            </div>
        </div>
        <div class="pod" id="p1">
            <svg
                id="crown"
                width="168"
                height="126"
                viewBox="0 0 12 9"
                shape-rendering="crispEdges"
            ></svg>
            <div class="q">?</div>
            <div class="blk">
                <div class="rk">1</div>
                <div class="amt" id="a1"></div>
            </div>
        </div>
        <div class="pod" id="p3">
            <div class="q">?</div>
            <div class="blk">
                <div class="rk">3</div>
                <div class="amt" id="a3"></div>
            </div>
        </div>
        <div class="floor"></div>
        <div class="more" id="more"></div>
        <div class="small">FREE TO PLAY · NO COIN NEEDED · PAID IN $ANSEM AFTER MIDNIGHT UTC</div>
        <script type="module">
            import { put } from '/scripts/og/x/x.js';
            const $ = (id) => document.getElementById(id);
            await document.fonts.ready;
            await Promise.all(
                ["40px 'Jersey 10'", "40px 'JetBrains Mono'"].map((f) => document.fonts.load(f))
            );
            const D = JSON.parse(
                new URLSearchParams(location.search).get('d') ||
                    '{"date":"15 OCT","places":["0.18","0.12","0.084"],"bounty":"0.4"}'
            );
            put($('mark'), 'emblem', 2000, { max: 4, glow: false });
            $('pill').textContent = `DAILY · ${D.date}`;
            $('a1').textContent = `${D.places[0]} SOL`;
            $('a2').textContent = `${D.places[1]} SOL`;
            $('a3').textContent = `${D.places[2]} SOL`;
            $('more').innerHTML = `#4–#10 PAID TOO · <b>${D.bounty} SOL</b> BOUNTY SHARED`;
            const CROWN = [
                '.y...yy...y.',
                '.y...yy...y.',
                '.yy.yyyy.yy.',
                '.yyyyyyyyyy.',
                '.yyyyyyyyyy.',
                '.yryygyyryy.',
                '.yyyyyyyyyy.',
                '.dddddddddd.'
            ];
            const pal = { y: '#f5c542', r: '#ff3b5c', g: '#16e08a', d: '#c8961e' };
            let h = '';
            CROWN.forEach((row, y) =>
                [...row].forEach((ch, x) => {
                    if (pal[ch])
                        h += `<rect x="${x}" y="${y}" width="1" height="1" fill="${pal[ch]}" />`;
                })
            );
            $('crown').innerHTML = h;
            // the game's own gold candles, falling behind everything
            const c = $('rain').getContext('2d');
            c.imageSmoothingEnabled = false;
            let seed = 15;
            const rnd = () => (seed = (seed * 16807) % 2147483647) / 2147483647;
            for (let i = 0; i < 34; i++) {
                const t = document.createElement('canvas');
                const k = 2 + Math.floor(rnd() * 4);
                put(t, rnd() < 0.5 ? 'xp_candle_big' : 'xp_candle', 2000, { max: k, glow: false });
                c.save();
                c.globalAlpha = 0.12 + k * 0.05;
                c.translate(Math.round(rnd() * 1200), Math.round(rnd() * 1500));
                c.rotate((rnd() - 0.5) * 0.9);
                c.drawImage(t, -t.width / 2, -t.height / 2);
                c.restore();
            }
            window.ready = true;
        </script>
    </body>
</html>
