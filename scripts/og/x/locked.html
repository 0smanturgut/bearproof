<!doctype html>
<html>
    <head>
        <meta charset="utf-8" />
        <style>
            /* The treasury's launch buy going back into a lock, as one big pixel padlock. Facts: 24,798,035.65
               $BPROOF (2.48% of supply) were in the Streamflow contract 7GRzRv3S…2fJB ("Founder allocation",
               sender = recipient = the treasury) and released on 5 Oct 2026, 00:22 UTC; the operator said on 5 Oct
               he will lock them again until 1 Jan 2027. Post it only once the new lock exists. ?u=<until> ?n=<amount>. */
            @font-face {
                font-family: 'Jersey 10';
                src: url('/hq/assets/fonts/jersey-10.woff2') format('woff2');
            }
            @font-face {
                font-family: 'JetBrains Mono';
                src: url('/hq/assets/fonts/jetbrains-mono-400.woff2') format('woff2');
            }
            * {
                box-sizing: border-box;
            }
            html,
            body {
                margin: 0;
                width: 1200px;
                height: 1500px;
                overflow: hidden;
                background: #05080f;
                color: #eaf0f5;
                font-family: 'Jersey 10', monospace;
            }
            canvas {
                image-rendering: pixelated;
            }
            .bg,
            .bg > * {
                position: absolute;
                inset: 0;
            }
            .grid {
                background:
                    linear-gradient(rgba(255, 255, 255, 0.035) 2px, transparent 2px) 0 0 / 60px 60px,
                    linear-gradient(90deg, rgba(255, 255, 255, 0.035) 2px, transparent 2px) 0 0 /
                        60px 60px;
            }
            .glow {
                background:
                    radial-gradient(
                        ellipse 56% 34% at 50% 53%,
                        rgba(245, 197, 66, 0.22),
                        transparent 70%
                    ),
                    radial-gradient(
                        ellipse 80% 26% at 50% 16%,
                        rgba(22, 224, 138, 0.1),
                        transparent 70%
                    );
            }
            .vig {
                background: radial-gradient(
                    ellipse 78% 72% at 50% 48%,
                    transparent 52%,
                    rgba(0, 0, 0, 0.75) 100%
                );
            }
            .top {
                position: absolute;
                left: 64px;
                right: 64px;
                top: 60px;
                height: 72px;
                display: flex;
                align-items: center;
                justify-content: space-between;
            }
            .brand {
                display: flex;
                align-items: center;
                gap: 18px;
                font-size: 66px;
                line-height: 1;
                letter-spacing: 0.04em;
            }
            .pill {
                display: flex;
                align-items: center;
                gap: 16px;
                padding: 2px 24px 4px 20px;
                background: #16e08a;
                color: #05080f;
                font-size: 56px;
                line-height: 1.1;
                letter-spacing: 0.05em;
                box-shadow:
                    0 0 0 4px #05080f,
                    0 0 0 8px #16e08a,
                    0 0 40px rgba(22, 224, 138, 0.55);
            }
            .pill i {
                width: 20px;
                height: 20px;
                background: #05080f;
            }
            h1 {
                position: absolute;
                left: 0;
                right: 0;
                top: 166px;
                margin: 0;
                text-align: center;
                font-weight: 400;
                font-size: 300px;
                line-height: 0.86;
                letter-spacing: 0.02em;
                color: #f4f8fb;
                text-shadow: 11px 11px 0 #101826;
            }
            #lock {
                position: absolute;
                left: 50%;
                top: 440px;
                filter: drop-shadow(0 26px 0 rgba(0, 0, 0, 0.45))
                    drop-shadow(0 0 70px rgba(245, 197, 66, 0.4));
            }
            .until {
                position: absolute;
                left: 0;
                right: 0;
                top: 1130px;
                text-align: center;
                font-size: 150px;
                line-height: 1;
                letter-spacing: 0.02em;
                color: #f5c542;
                text-shadow:
                    8px 8px 0 #4a3a0a,
                    0 0 50px rgba(245, 197, 66, 0.5);
                white-space: nowrap;
            }
            .amt {
                position: absolute;
                left: 0;
                right: 0;
                top: 1292px;
                text-align: center;
                font-size: 76px;
                line-height: 1;
                letter-spacing: 0.03em;
                color: #f4f8fb;
                white-space: nowrap;
            }
            .small {
                position: absolute;
                left: 0;
                right: 0;
                top: 1400px;
                text-align: center;
                font:
                    400 24px/1 'JetBrains Mono',
                    monospace;
                letter-spacing: 0.24em;
                color: #8a97a5;
            }
        </style>
    </head>
    <body>
        <div class="bg">
            <div class="grid"></div>
            <div class="glow"></div>
            <div class="vig"></div>
        </div>
        <div class="top">
            <div class="brand"><canvas id="mark"></canvas>BEARPROOF</div>
            <div class="pill"><i></i>TREASURY</div>
        </div>
        <h1>LOCKED</h1>
        <canvas id="lock"></canvas>
        <div class="until" id="until"></div>
        <div class="amt" id="amt"></div>
        <div class="small">THE TREASURY'S LAUNCH BUY, BACK IN A LOCK</div>
        <script type="module">
            import { put } from '/scripts/og/x/x.js';
            const $ = (id) => document.getElementById(id);
            await document.fonts.ready;
            await Promise.all(
                ["40px 'Jersey 10'", "40px 'JetBrains Mono'"].map((f) => document.fonts.load(f))
            );
            const q = new URLSearchParams(location.search);
            put($('mark'), 'emblem', 2000, { max: 4, glow: false });
            $('until').textContent = q.get('u') || 'UNTIL 1 JAN 2027';
            $('amt').textContent = q.get('n') || '24.8M TOKENS · 2.48% OF SUPPLY';

            // one big padlock on a 26×30 grid
            const P = 22,
                GW = 26,
                GH = 30;
            const c = $('lock');
            c.width = GW * P;
            c.height = GH * P;
            c.style.marginLeft = -(GW * P) / 2 + 'px';
            const x = c.getContext('2d');
            const cell = (cx, cy, col) => {
                x.fillStyle = col;
                x.fillRect(cx * P, cy * P, P, P);
            };
            // shackle: an arch of steel, three cells thick
            const ARCH = [
                [9, 16],
                [7, 18],
                [6, 19],
                [5, 20]
            ];
            for (let y = 0; y < 13; y++)
                for (let cx = 0; cx < GW; cx++) {
                    let on = false,
                        edge = false;
                    if (y < 4) {
                        const [a, b] = ARCH[y];
                        on = cx >= a && cx <= b;
                        // hollow inside from row 3 down
                        if (y === 3 && cx >= 9 && cx <= 16) on = false;
                    } else {
                        on = (cx >= 5 && cx <= 8) || (cx >= 17 && cx <= 20);
                    }
                    if (!on) continue;
                    edge = cx >= 19 || (cx >= 7 && cx <= 8);
                    cell(
                        cx,
                        y,
                        y === 0
                            ? '#e3e9f2'
                            : edge
                              ? '#7d889a'
                              : cx <= 5 || (cx >= 17 && cx <= 17)
                                ? '#dfe6f0'
                                : '#aeb8c8'
                    );
                }
            // body: gold, lit from the top left
            for (let y = 12; y < GH; y++)
                for (let cx = 1; cx < GW - 1; cx++) {
                    const corner = (y === 12 || y === GH - 1) && (cx === 1 || cx === GW - 2);
                    if (corner) continue;
                    let col = '#f5c542';
                    if (y === 12) col = '#ffe79a';
                    else if (cx === 1 || (cx === 2 && y < GH - 3)) col = '#ffdf78';
                    else if (y >= GH - 2 || cx >= GW - 3) col = '#b8891c';
                    else if (y >= GH - 4) col = '#dba92c';
                    cell(cx, y, col);
                }
            // keyhole
            for (const [cx, cy] of [
                [12, 17],
                [13, 17],
                [11, 18],
                [12, 18],
                [13, 18],
                [14, 18],
                [11, 19],
                [12, 19],
                [13, 19],
                [14, 19],
                [12, 20],
                [13, 20],
                [12, 21],
                [13, 21],
                [12, 22],
                [13, 22],
                [12, 23],
                [13, 23]
            ])
                cell(cx, cy, '#2a1f05');
            // rivets
            for (const [cx, cy] of [
                [3, 14],
                [22, 14],
                [3, 27],
                [22, 27]
            ])
                cell(cx, cy, '#8a6410');
            window.ready = true;
        </script>
    </body>
</html>
