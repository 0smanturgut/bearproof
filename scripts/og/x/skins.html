<!doctype html>
<html>
    <head>
        <meta charset="utf-8" />
        <style>
            /* Build #25, The Market, as a shop window: the four new skins on lit pedestals with their prices, the
               two originals behind the glass. devlog/build-25.md: CLOUT is earned only by playing (it can't be
               bought, sold or withdrawn and isn't a coin); Gold Standard 800, Midnight Bull 1,200, Frost Frog 800,
               Night Shift Frog 1,200. Sprites are the game's own (bull_gold, bull_midnight, pepe_frost, pepe_night,
               bull, pepe); the shelf and the tags are drawn here. */
            @font-face {
                font-family: 'Jersey 10';
                src: url('/hq/assets/fonts/jersey-10.woff2') format('woff2');
            }
            @font-face {
                font-family: 'JetBrains Mono';
                src: url('/hq/assets/fonts/jetbrains-mono-400.woff2') format('woff2');
            }
            * {
                box-sizing: border-box;
            }
            html,
            body {
                margin: 0;
                width: 1200px;
                height: 1500px;
                overflow: hidden;
                background: #05080f;
                color: #f4f8fb;
                font-family: 'Jersey 10', monospace;
            }
            canvas {
                image-rendering: pixelated;
            }
            .bg {
                position: absolute;
                inset: 0;
                background:
                    radial-gradient(
                        ellipse 70% 30% at 50% 48%,
                        rgba(245, 197, 66, 0.2),
                        transparent 70%
                    ),
                    linear-gradient(rgba(255, 255, 255, 0.03) 2px, transparent 2px) 0 0 / 60px 60px,
                    linear-gradient(90deg, rgba(255, 255, 255, 0.03) 2px, transparent 2px) 0 0 /
                        60px 60px;
            }
            .top {
                position: absolute;
                left: 64px;
                right: 64px;
                top: 60px;
                height: 72px;
                display: flex;
                align-items: center;
                justify-content: space-between;
            }
            .brand {
                display: flex;
                align-items: center;
                gap: 18px;
                font-size: 66px;
                line-height: 1;
                letter-spacing: 0.04em;
            }
            .pill {
                padding: 2px 24px 4px;
                background: #f5c542;
                color: #05080f;
                font-size: 56px;
                line-height: 1.1;
                letter-spacing: 0.05em;
                box-shadow:
                    0 0 0 4px #05080f,
                    0 0 0 8px #f5c542,
                    0 0 40px rgba(245, 197, 66, 0.5);
            }
            h1 {
                position: absolute;
                left: 0;
                right: 0;
                top: 170px;
                margin: 0;
                text-align: center;
                font-weight: 400;
                font-size: 186px;
                line-height: 0.86;
                text-shadow: 9px 9px 0 #101826;
            }
            h1 span {
                color: #f5c542;
                text-shadow:
                    9px 9px 0 #3a2a08,
                    0 0 70px rgba(245, 197, 66, 0.5);
            }
            .row {
                position: absolute;
                left: 40px;
                right: 40px;
                display: grid;
                grid-template-columns: repeat(2, 1fr);
                gap: 30px;
            }
            .slot {
                position: relative;
                height: 400px;
            }
            .slot canvas {
                position: absolute;
                left: 50%;
                bottom: 110px;
                transform: translateX(-50%);
                filter: drop-shadow(0 0 40px rgba(245, 197, 66, 0.35));
            }
            .ped {
                position: absolute;
                left: 60px;
                right: 60px;
                bottom: 52px;
                height: 64px;
                background: linear-gradient(180deg, #3a4252, #1d2330);
                box-shadow:
                    inset 0 6px 0 rgba(255, 255, 255, 0.14),
                    0 0 0 5px #05080f,
                    0 18px 0 rgba(0, 0, 0, 0.45);
            }
            .tag {
                position: absolute;
                left: 50%;
                bottom: 0;
                transform: translateX(-50%);
                white-space: nowrap;
                padding: 2px 22px 6px;
                background: #f5c542;
                color: #05080f;
                font-size: 50px;
                line-height: 1.05;
                box-shadow:
                    0 0 0 4px #05080f,
                    8px 8px 0 rgba(0, 0, 0, 0.45);
            }
            .name {
                position: absolute;
                left: 0;
                right: 0;
                top: 6px;
                text-align: center;
                font-size: 56px;
                line-height: 1;
                color: #f4f8fb;
                text-shadow: 4px 4px 0 #101826;
            }
            .small {
                position: absolute;
                left: 0;
                right: 0;
                top: 1420px;
                text-align: center;
                font:
                    400 23px/1 'JetBrains Mono',
                    monospace;
                letter-spacing: 0.12em;
                color: #b8c4d2;
            }
        </style>
    </head>
    <body>
        <div class="bg"></div>
        <div class="top">
            <div class="brand"><canvas id="mark"></canvas>BEARPROOF</div>
            <div class="pill">BUILD #25</div>
        </div>
        <h1>THE MARKET<br /><span>IS OPEN.</span></h1>
        <div class="row" style="top: 520px" id="r1"></div>
        <div class="row" style="top: 960px" id="r2"></div>
        <div class="small">LEVELS · CLOUT · SKINS · EARNED BY PLAYING, NEVER BOUGHT</div>
        <script type="module">
            import { put } from '/scripts/og/x/x.js';
            const $ = (id) => document.getElementById(id);
            await document.fonts.ready;
            await Promise.all(
                ["40px 'Jersey 10'", "40px 'JetBrains Mono'"].map((f) => document.fonts.load(f))
            );
            put($('mark'), 'emblem', 2000, { max: 4, glow: false });
            const slot = (host, id, name, price) => {
                const d = document.createElement('div');
                d.className = 'slot';
                d.innerHTML = `<div class="name">${name}</div><div class="ped"></div><div class="tag">${price}</div>`;
                const c = document.createElement('canvas');
                put(c, id, 240, { max: 10, glow: false });
                d.append(c);
                host.append(d);
            };
            slot($('r1'), 'bull_gold', 'GOLD STANDARD', '800 CLOUT');
            slot($('r1'), 'bull_midnight', 'MIDNIGHT BULL', '1,200 CLOUT');
            slot($('r2'), 'pepe_frost', 'FROST FROG', '800 CLOUT');
            slot($('r2'), 'pepe_night', 'NIGHT SHIFT FROG', '1,200 CLOUT');
            window.ready = true;
        </script>
    </body>
</html>
