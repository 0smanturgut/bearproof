<!doctype html>
<html>
    <head>
        <meta charset="utf-8" />
        <link rel="stylesheet" href="/scripts/og/x/x.css" />
        <style>
            /* The first $ANSEM prize. Filled from the query string after the payout lands:
               ?day=2&date=24 SEP&name=…&score=…&time=20:00&amount=…&sol=…&tx=<short sig> */
            body {
                background:
                    radial-gradient(
                        ellipse 60% 70% at 50% 40%,
                        rgba(245, 197, 66, 0.14),
                        transparent 62%
                    ),
                    linear-gradient(var(--grid) 1px, transparent 1px) 0 0 / 50px 50px,
                    linear-gradient(90deg, var(--grid) 1px, transparent 1px) 0 0 / 50px 50px,
                    var(--ground);
            }
            .brand {
                left: 64px;
                top: 44px;
            }
            .c {
                position: absolute;
                inset: 0;
                display: grid;
                place-content: center;
                justify-items: center;
                text-align: center;
                gap: 18px;
            }
            .kicker {
                font: 400 38px/1 'Jersey 10';
                letter-spacing: 0.1em;
                color: var(--gold);
            }
            .display {
                font-size: 128px;
            }
            .amt {
                font: 400 110px/1 'Jersey 10';
                color: var(--gold);
                text-shadow:
                    0 7px 0 #3a2a06,
                    0 0 50px rgba(245, 197, 66, 0.4);
            }
            .who {
                display: flex;
                gap: 16px;
                font-size: 26px;
                color: #cfd8e0;
            }
            .who span {
                padding: 10px 16px 8px;
                box-shadow: inset 0 0 0 1px var(--line);
                background: rgba(8, 12, 16, 0.9);
            }
            .who b {
                color: var(--text);
                font-weight: 600;
            }
            .tx {
                font-size: 20px;
                color: var(--muted);
            }
            .tx b {
                color: var(--green);
                font-weight: 400;
            }
        </style>
    </head>
    <body>
        <div class="brand">BEARPROOF</div>
        <div class="c">
            <div class="kicker" id="kicker"></div>
            <h1 class="display">THE FIRST <span class="green">$ANSEM</span> PRIZE</h1>
            <div class="amt" id="amt"></div>
            <div class="who">
                <span>Winner <b id="name"></b></span><span>Score <b id="score"></b></span
                ><span>Survived <b id="time"></b></span
                ><span><b style="color: var(--green)">✓ replayed</b></span>
            </div>
            <div class="tx">Bought on-chain with treasury SOL, sent by me · tx <b id="tx"></b></div>
        </div>
        <script type="module">
            import { brand, ready } from '/scripts/og/x/x.js';
            brand(document.querySelector('.brand'));
            const q = new URLSearchParams(location.search);
            const set = (id, v) => (document.getElementById(id).textContent = v);
            set(
                'kicker',
                `DAY ${q.get('day') || '2'} · ${q.get('date') || '24 SEP'} · DAILY CHALLENGE`
            );
            set('amt', `${q.get('amount') || '—'} $ANSEM`);
            set('name', q.get('name') || '—');
            set('score', q.get('score') || '—');
            set('time', q.get('time') || '—');
            set('tx', q.get('tx') || '—');
            await ready();
        </script>
    </body>
</html>
