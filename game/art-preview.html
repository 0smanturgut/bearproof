<!doctype html>
<!--
    Dev-only sprite sheet for BULL RUN. Not linked from the game.
    Run `node game/server.js` and open http://localhost:3000/art-preview.html
    Query params: ?only3x  ·  ?flash (white hit-flash tint)  ·  ?big=bull,icon:alpha&z=10 (close-up)
-->
<html lang="en">
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <meta name="robots" content="noindex" />
        <title>Sprite Sheet</title>
        <style>
            :root {
                --ink: #07090c;
                --panel: #0e1217;
                --grid: #1b222b;
                --text: #e8edf2;
                --muted: #7d8896;
                --bull: #16e08a;
                --gold: #ffc53d;
            }
            * {
                box-sizing: border-box;
            }
            body {
                margin: 0;
                padding: 24px 16px 64px;
                background-color: var(--ink);
                background-image:
                    linear-gradient(var(--grid) 1px, transparent 1px),
                    linear-gradient(90deg, var(--grid) 1px, transparent 1px);
                background-size: 40px 40px;
                color: var(--text);
                font-family: 'JetBrains Mono', ui-monospace, monospace;
                font-size: 12px;
            }
            h1 {
                margin: 0 0 4px;
                font-size: 20px;
                color: var(--bull);
                letter-spacing: 0.04em;
            }
            h2 {
                margin: 32px 0 12px;
                font-size: 14px;
                color: var(--gold);
                text-transform: uppercase;
                letter-spacing: 0.12em;
            }
            h3 {
                margin: 16px 0 8px;
                font-size: 12px;
                color: var(--muted);
                text-transform: uppercase;
                letter-spacing: 0.1em;
            }
            p {
                margin: 0;
                color: var(--muted);
            }
            .controls {
                margin: 12px 0 0;
                display: flex;
                gap: 16px;
                flex-wrap: wrap;
                color: var(--muted);
            }
            .row {
                display: flex;
                flex-wrap: wrap;
                gap: 12px;
                align-items: flex-start;
            }
            .card {
                background: rgba(14, 18, 23, 0.72);
                border: 1px solid var(--grid);
                padding: 10px;
                display: flex;
                flex-direction: column;
                gap: 8px;
                max-width: 100%;
                overflow-x: auto;
            }
            .card .meta {
                color: var(--muted);
            }
            .scales {
                display: flex;
                gap: 14px;
                align-items: flex-end;
                flex-wrap: wrap;
            }
            .frames {
                display: flex;
                gap: 6px;
                align-items: flex-end;
            }
            canvas {
                image-rendering: pixelated;
                display: block;
            }
            .scene {
                border: 1px solid var(--grid);
                max-width: 100%;
                height: auto;
            }
            body.only-3x .s1,
            body.only-3x .s6 {
                display: none;
            }
        </style>
    </head>
    <body>
        <h1>BULL RUN sprite sheet</h1>
        <p>
            Procedural pixel art from src/art/sprites.js. Every sprite and icon at 1×, 3× and 6×,
            all frames.
        </p>
        <div class="controls">
            <label><input type="checkbox" id="animate" checked /> animate</label>
            <label><input type="checkbox" id="only3x" /> 3× only</label>
            <label><input type="checkbox" id="flash" /> hit-flash tint</label>
        </div>

        <h2>Scene (in-game scale, 3×)</h2>
        <canvas id="scene" class="scene" width="960" height="420"></canvas>

        <h2>Boss scale (3×)</h2>
        <canvas id="bosses-scene" class="scene" width="960" height="200"></canvas>

        <div id="groups"></div>

        <script type="module">
            import {
                SPRITES,
                SPRITE_GROUPS,
                ICONS,
                ICON_GROUPS,
                bakeSprite,
                bakeIcon
            } from './src/art/sprites.js';

            const SCALES = [1, 3, 6];
            const S = 3; // in-game scale for the scene strips
            const params = new URLSearchParams(location.search);
            const $ = (id) => document.getElementById(id);
            if (params.has('only3x')) $('only3x').checked = true;
            if (params.has('flash')) $('flash').checked = true;
            const flashTint = () => ($('flash').checked ? '#FFFFFF' : null);

            function clone(src) {
                const c = document.createElement('canvas');
                c.width = src.width;
                c.height = src.height;
                c.getContext('2d').drawImage(src, 0, 0);
                return c;
            }

            function card(id, def, bake, scales = SCALES) {
                const el = document.createElement('div');
                el.className = 'card';
                const n = def.frames.length;
                el.innerHTML = `<div>${id}</div><div class="meta">${def.w}×${def.h} · ${n} frame${n > 1 ? 's' : ''}${def.fps ? ` · ${def.fps} fps` : ''}</div>`;
                const row = document.createElement('div');
                row.className = 'scales';
                for (const s of scales) {
                    const wrap = document.createElement('div');
                    wrap.className = `frames s${s}`;
                    for (const c of bake(id, s, { tint: flashTint() })) wrap.appendChild(clone(c));
                    row.appendChild(wrap);
                }
                el.appendChild(row);
                return el;
            }

            function section(root, title, id, groups) {
                const h = document.createElement('h2');
                h.textContent = title;
                root.appendChild(h);
                for (const [sub, ids, table, bake] of groups) {
                    if (sub) {
                        const h3 = document.createElement('h3');
                        h3.textContent = sub;
                        root.appendChild(h3);
                    }
                    const row = document.createElement('div');
                    row.className = 'row';
                    row.dataset.group = sub ? `${id}-${sub}` : id;
                    for (const sid of ids) row.appendChild(card(sid, table[sid], bake));
                    root.appendChild(row);
                }
            }

            function renderGroups() {
                document.body.classList.toggle('only-3x', $('only3x').checked);
                const root = $('groups');
                root.innerHTML = '';
                if (params.has('big')) {
                    // Close-up mode: ?big=bull,icon:alpha&z=10
                    const z = Number(params.get('z')) || 10;
                    const row = document.createElement('div');
                    row.className = 'row';
                    row.dataset.group = 'big';
                    for (const raw of params.get('big').split(',')) {
                        const isIcon = raw.startsWith('icon:');
                        const id = isIcon ? raw.slice(5) : raw;
                        const table = isIcon ? ICONS : SPRITES;
                        if (table[id])
                            row.appendChild(
                                card(
                                    raw,
                                    table[id],
                                    (_, s, o) => (isIcon ? bakeIcon : bakeSprite)(id, s, o),
                                    [z]
                                )
                            );
                    }
                    root.appendChild(row);
                    return;
                }
                section(root, 'Player', 'player', [
                    ['', SPRITE_GROUPS.player, SPRITES, bakeSprite]
                ]);
                section(root, 'Enemies', 'enemies', [
                    ['', SPRITE_GROUPS.enemies, SPRITES, bakeSprite]
                ]);
                section(root, 'Bosses', 'bosses', [
                    ['', SPRITE_GROUPS.bosses, SPRITES, bakeSprite]
                ]);
                section(root, 'Projectiles / pickups', 'projectiles', [
                    ['', SPRITE_GROUPS.pickups, SPRITES, bakeSprite]
                ]);
                section(root, 'Icons (12×12)', 'icons', [
                    ['weapons', ICON_GROUPS.weapons, ICONS, bakeIcon],
                    ['passives', ICON_GROUPS.passives, ICONS, bakeIcon]
                ]);
            }

            // ------------------------------------------------ scene strips
            const CAST = [
                ['red_candle', 170, 150],
                ['red_candle', 250, 300],
                ['red_candle', 700, 120],
                ['red_candle', 760, 330],
                ['bag_holder', 110, 260],
                ['paper_hands', 330, 90],
                ['rug_puller', 620, 360],
                ['grizzly', 820, 220],
                ['fud_cloud', 560, 70],
                ['doomposter', 300, 360],
                ['ponzi', 660, 250],
                ['downline', 700, 200],
                ['downline', 720, 285],
                ['margin_call', 420, 350],
                ['sybil', 200, 70],
                ['sybil', 235, 95, '#E8EDF2'],
                ['xp_candle', 400, 170],
                ['xp_candle', 430, 250],
                ['xp_candle', 540, 290],
                ['xp_candle_big', 360, 260],
                ['heart', 560, 180],
                ['diamond', 440, 160],
                ['green_candle', 560, 120],
                ['fud_bolt', 610, 160],
                ['dead_cat', 380, 150],
                ['limit_order', 350, 200],
                ['airdrop', 110, 110]
            ];
            const PICKUPS = new Set(SPRITE_GROUPS.pickups);
            const t0 = performance.now();

            function grid(ctx, w, h) {
                ctx.fillStyle = '#07090C';
                ctx.fillRect(0, 0, w, h);
                ctx.fillStyle = '#1B222B';
                for (let x = 0; x < w; x += 40) ctx.fillRect(x, 0, 1, h);
                for (let y = 0; y < h; y += 40) ctx.fillRect(0, y, w, 1);
            }

            function drawAt(
                ctx,
                id,
                x,
                y,
                t,
                { flip = false, tint = null, anchor = 'center' } = {}
            ) {
                const frames = bakeSprite(id, S, { flip, tint });
                const def = SPRITES[id];
                const fi = Math.floor(Math.max(0, t / 1000) * (def.fps || 4)) % frames.length;
                const c = frames[fi];
                const oy = anchor === 'bottom' ? c.height : c.height / 2;
                ctx.drawImage(c, Math.round(x - c.width / 2), Math.round(y - oy));
            }

            function drawScene(t) {
                const cv = $('scene');
                const ctx = cv.getContext('2d');
                grid(ctx, cv.width, cv.height);
                const px = 480;
                const py = 210;
                const beam = bakeSprite('laser', S)[0];
                for (let x = px + 40; x < 780; x += beam.width) ctx.drawImage(beam, x, py - 4);
                for (const [id, x, y, tint] of CAST) {
                    // Enemies face the bull: sprites face right, so flip the ones to its right.
                    const flip = x > px && !PICKUPS.has(id);
                    drawAt(ctx, id, x, y, t + x * 7, { flip, tint: tint || flashTint() });
                }
                drawAt(ctx, 'bull', px, py, t, { tint: flashTint() });
                const a = t / 400;
                drawAt(ctx, 'diamond', px + Math.cos(a) * 60, py + Math.sin(a) * 60, t);
            }

            function drawBosses(t) {
                const cv = $('bosses-scene');
                const ctx = cv.getContext('2d');
                grid(ctx, cv.width, cv.height);
                const floor = 188;
                drawAt(ctx, 'bull', 60, floor, t, { anchor: 'bottom', tint: flashTint() });
                const line = [
                    ['rug_lord', 200],
                    ['capitulation', 340],
                    ['liquidation', 470],
                    ['bear_market', 640],
                    ['long_winter', 840]
                ];
                for (const [id, x] of line)
                    drawAt(ctx, id, x, floor, t, {
                        flip: true,
                        anchor: 'bottom',
                        tint: flashTint()
                    });
            }

            function loop(now) {
                const t = $('animate').checked ? now - t0 : 0;
                drawScene(t);
                drawBosses(t);
                requestAnimationFrame(loop);
            }

            renderGroups();
            requestAnimationFrame(loop);
            for (const id of ['flash', 'only3x']) $(id).addEventListener('change', renderGroups);
            window.__artReady = true;
        </script>
    </body>
</html>
