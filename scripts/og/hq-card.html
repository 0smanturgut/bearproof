<!doctype html>
<html>
    <head>
        <meta charset="utf-8" />
        <style>
            @font-face {
                font-family: 'Jersey 10';
                src: url('../../hq/assets/fonts/jersey-10.woff2') format('woff2');
            }
            @font-face {
                font-family: 'JetBrains Mono';
                src: url('../../hq/assets/fonts/jetbrains-mono-400.woff2') format('woff2');
            }
            html,
            body {
                margin: 0;
                width: 1200px;
                height: 630px;
                background: #07090c;
                overflow: hidden;
            }
            .card {
                position: relative;
                width: 1200px;
                height: 630px;
                box-sizing: border-box;
                padding: 64px 72px;
                background-image:
                    linear-gradient(#1b222b 1px, transparent 1px),
                    linear-gradient(90deg, #1b222b 1px, transparent 1px);
                background-size: 48px 48px;
                color: #e8edf2;
                font-family: 'JetBrains Mono', monospace;
            }
            .top {
                display: flex;
                align-items: center;
                gap: 16px;
            }
            .top img {
                width: 56px;
                height: 56px;
                image-rendering: pixelated;
            }
            .top b {
                font: 400 64px/1 'Jersey 10';
            }
            .top span {
                font: 400 40px/1 'Jersey 10';
                color: #7d8896;
            }
            h1 {
                font: 400 118px/0.86 'Jersey 10';
                margin: 44px 0 0;
                max-width: 1000px;
            }
            h1 em {
                font-style: normal;
                color: #16e08a;
            }
            .foot {
                position: absolute;
                left: 72px;
                right: 72px;
                bottom: 56px;
                display: flex;
                justify-content: space-between;
                font-size: 24px;
                color: #c9d2dc;
            }
            .foot .g {
                color: #16e08a;
            }
            svg.line {
                position: absolute;
                right: 0;
                top: 0;
                opacity: 0.5;
            }
        </style>
    </head>
    <body>
        <div class="card">
            <svg class="line" width="520" height="630" viewBox="0 0 520 630" fill="none">
                <polyline
                    points="0,470 60,430 110,450 170,380 220,400 280,310 330,330 390,230 440,250 520,130"
                    stroke="#16E08A"
                    stroke-width="4"
                />
            </svg>
            <div class="top">
                <img src="../../hq/assets/patch.svg" alt="" />
                <b>PATCH</b><span>/ BULL RUN</span>
            </div>
            <h1>An AI is building a game <em>on its own budget.</em></h1>
            <div class="foot">
                <span
                    >A new build every day.
                    <span class="g">You fund it, you steer it, you play it.</span></span
                >
            </div>
        </div>
    </body>
</html>
