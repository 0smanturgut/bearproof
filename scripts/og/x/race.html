<!doctype html>
<html>
    <head>
        <meta charset="utf-8" />
        <link rel="stylesheet" href="/scripts/og/x/x.css" />
        <style>
            /* The Daily Challenge board before the close, from /api/leaderboard (verified rows only). Data in ?d=<json>:
               { kicker, title, titleGreen, sub, rows: [{ rank, name, time, level, score }], foot } */
            body {
                background:
                    radial-gradient(
                        ellipse 55% 65% at 100% 50%,
                        rgba(245, 197, 66, 0.1),
                        transparent 60%
                    ),
                    radial-gradient(
                        ellipse 50% 60% at 0% 100%,
                        rgba(22, 224, 138, 0.07),
                        transparent 60%
                    ),
                    linear-gradient(var(--grid) 1px, transparent 1px) 0 0 / 50px 50px,
                    linear-gradient(90deg, var(--grid) 1px, transparent 1px) 0 0 / 50px 50px,
                    var(--ground);
            }
            .brand {
                left: 64px;
                top: 44px;
            }
            .head {
                position: absolute;
                left: 64px;
                top: 130px;
                width: 640px;
            }
            .kicker {
                font: 400 30px/1.1 'Jersey 10';
                letter-spacing: 0.08em;
                color: var(--gold);
            }
            .display {
                font-size: 118px;
                line-height: 0.88;
                margin-top: 18px;
            }
            .sub {
                margin-top: 26px;
                font-size: 23px;
                line-height: 1.5;
                color: #c9d2dc;
            }
            .sub b {
                font-weight: 400;
                color: var(--text);
            }
            .clock {
                display: inline-flex;
                gap: 12px;
                align-items: baseline;
                margin-top: 26px;
                padding: 12px 18px 10px;
                box-shadow: inset 0 0 0 1px rgba(255, 59, 92, 0.5);
                background: rgba(255, 59, 92, 0.07);
                font: 400 36px/1 'Jersey 10';
                color: var(--red);
                letter-spacing: 0.05em;
            }
            .board {
                position: absolute;
                right: 64px;
                top: 120px;
                width: 780px;
                background: rgba(8, 12, 16, 0.96);
                box-shadow:
                    inset 0 0 0 2px #1d3b30,
                    0 30px 90px rgba(0, 0, 0, 0.6);
            }
            .board h2 {
                margin: 0;
                padding: 20px 28px 16px;
                display: flex;
                justify-content: space-between;
                font: 400 30px/1 'Jersey 10';
                letter-spacing: 0.08em;
                color: var(--muted);
                border-bottom: 1px solid var(--line);
            }
            .board h2 b {
                font-weight: 400;
                color: var(--green);
            }
            .r {
                display: grid;
                grid-template-columns: 70px 1fr auto;
                align-items: center;
                gap: 16px;
                padding: 16px 28px;
                border-top: 1px solid var(--line);
            }
            .r:first-of-type {
                border-top: 0;
            }
            .r .n {
                font: 400 44px/1 'Jersey 10';
                color: var(--muted);
            }
            .r .nm {
                font: 400 40px/1 'Jersey 10';
                color: var(--text);
                white-space: nowrap;
                overflow: hidden;
                text-overflow: ellipsis;
            }
            .r .nm small {
                display: block;
                margin-top: 6px;
                font:
                    19px/1.2 'JetBrains Mono',
                    monospace;
                color: var(--muted);
            }
            .r .sc {
                font: 400 48px/1 'Jersey 10';
                color: var(--text);
            }
            .r.top {
                background: rgba(245, 197, 66, 0.08);
                box-shadow: inset 4px 0 0 var(--gold);
            }
            .r.top .n,
            .r.top .sc {
                color: var(--gold);
                text-shadow: 0 0 26px rgba(245, 197, 66, 0.35);
            }
            .xnote {
                position: absolute;
                left: 64px;
                right: 64px;
                bottom: 30px;
                font-size: 19px;
                color: var(--muted);
                white-space: nowrap;
            }
        </style>
    </head>
    <body>
        <div class="brand">BEARPROOF</div>
        <div class="head">
            <div class="kicker" id="kicker"></div>
            <h1 class="display"><span id="t1"></span> <span class="green" id="t2"></span></h1>
            <p class="sub" id="sub"></p>
            <div class="clock" id="clock"></div>
        </div>
        <div class="board">
            <h2><span id="bh"></span><b>VERIFIED</b></h2>
            <div id="rows"></div>
        </div>
        <div class="xnote" id="foot"></div>
        <script type="module">
            import { brand, ready } from '/scripts/og/x/x.js';
            brand(document.querySelector('.brand'));
            const d = JSON.parse(new URLSearchParams(location.search).get('d') || '{}');
            const $ = (id) => document.getElementById(id);
            $('kicker').textContent = d.kicker || '';
            $('t1').textContent = d.title || '';
            $('t2').textContent = d.titleGreen || '';
            $('sub').innerHTML = d.sub || '';
            $('clock').textContent = d.clock || '';
            $('bh').textContent = d.boardHead || '';
            $('foot').textContent = d.foot || '';
            (d.rows || []).forEach((row, i) => {
                const r = document.createElement('div');
                r.className = 'r' + (i === 0 ? ' top' : '');
                const n = document.createElement('span');
                n.className = 'n';
                n.textContent = '#' + row.rank;
                const nm = document.createElement('span');
                nm.className = 'nm';
                nm.textContent = row.name;
                const s = document.createElement('small');
                s.textContent = row.meta;
                nm.append(s);
                const sc = document.createElement('span');
                sc.className = 'sc';
                sc.textContent = row.score;
                r.append(n, nm, sc);
                $('rows').append(r);
            });
            await ready();
        </script>
    </body>
</html>
