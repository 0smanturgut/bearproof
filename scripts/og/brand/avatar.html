<!doctype html>
<html>
    <head>
        <meta charset="utf-8" />
        <style>
            html,
            body {
                margin: 0;
                width: 400px;
                height: 400px;
                overflow: hidden;
                background:
                    radial-gradient(circle at 50% 45%, rgba(22, 224, 138, 0.3), transparent 62%),
                    linear-gradient(#131a22 1px, transparent 1px) 0 0 / 25px 25px,
                    linear-gradient(90deg, #131a22 1px, transparent 1px) 0 0 / 25px 25px,
                    #06080b;
                display: grid;
                place-items: center;
            }
            canvas {
                image-rendering: pixelated;
                filter: drop-shadow(0 8px 0 rgba(0, 0, 0, 0.45))
                    drop-shadow(0 0 20px rgba(22, 224, 138, 0.45));
            }
        </style>
    </head>
    <body>
        <canvas id="m"></canvas>
        <script type="module">
            import { bakeSprite } from '/scripts/og/lib/scene.js';
            const f = bakeSprite('emblem_large', 8)[0];
            const c = document.getElementById('m');
            c.width = f.width;
            c.height = f.height;
            c.getContext('2d').drawImage(f, 0, 0);
            window.ready = true;
        </script>
    </body>
</html>
