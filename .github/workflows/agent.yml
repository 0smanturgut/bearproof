name: Build Agent (daily)

# The Build Agent's daily loop, streamed live to https://bearproof.app/live:
# wait for the 21:00 UTC vote close → gather context (vote, player data) → Claude Code builds one feature →
# a second Claude Code pass reviews it → guard → secret scan → gates → measured cost into the devlog →
# PR with auto-merge. Deploy (and the build tag) happen in deploy.yml on merge.
# A red gate means no PR; the run log and screenshots stay as artifacts.
#
# GitHub starts scheduled workflows hours late on this repo, so the schedule fires several times from 17:13 UTC.
# The first run to start waits until 21:00 UTC and does the work; the others see it and stop.

on:
    schedule:
        - cron: '13 17 * * *'
        - cron: '43 18 * * *'
        - cron: '23 20 * * *'
        - cron: '7 21 * * *'
        - cron: '37 21 * * *'
    workflow_dispatch:
        inputs:
            now:
                description: 'Start now instead of waiting for 21:00 UTC (testing)'
                type: boolean
                default: false

permissions:
    contents: write # push the agent branch
    pull-requests: write # open the PR, enable auto-merge
    actions: write # dispatch CI on the branch and the deploy after merge; list today's runs

concurrency:
    group: build-agent
    cancel-in-progress: false

jobs:
    wait:
        runs-on: ubuntu-latest
        timeout-minutes: 300
        outputs:
            go: ${{ steps.gate.outputs.go }}
        steps:
            - name: One run a day, after the vote closes
              id: gate
              env:
                  GH_TOKEN: ${{ github.token }}
                  NOW_INPUT: ${{ inputs.now }}
              run: |
                  HOUR=$(date -u +%H)
                  if [ "$NOW_INPUT" != "true" ] && [ "$HOUR" -lt 17 ]; then
                    echo "::notice::Started at ${HOUR}:xx UTC, outside the build window (17:00–24:00). The next window runs it."
                    echo "go=false" >> "$GITHUB_OUTPUT"; exit 0
                  fi
                  TODAY=$(date -u +%F)
                  OTHERS=$(gh run list -R "$GITHUB_REPOSITORY" -w agent.yml --created ">=$TODAY" \
                    --json databaseId,status,conclusion -L 30 \
                    | node -e "let s='';process.stdin.on('data',c=>s+=c).on('end',()=>{const me=String(process.env.GITHUB_RUN_ID);const r=JSON.parse(s).filter(x=>String(x.databaseId)!==me&&(x.status!=='completed'||x.conclusion==='success'));console.log(r.length)})")
                  if [ "$OTHERS" != "0" ]; then
                    echo "::notice::Another Build Agent run already started today ($OTHERS). This one stops."
                    echo "go=false" >> "$GITHUB_OUTPUT"; exit 0
                  fi
                  if [ "$NOW_INPUT" != "true" ]; then
                    CLOSE=$(date -u -d "$TODAY 21:00:00" +%s)
                    LEFT=$(( CLOSE - $(date -u +%s) ))
                    if [ "$LEFT" -gt 0 ]; then
                      echo "Waiting $LEFT s for the 21:00 UTC vote close."
                      sleep "$LEFT"
                    fi
                  fi
                  echo "go=true" >> "$GITHUB_OUTPUT"

    build:
        needs: wait
        if: needs.wait.outputs.go == 'true'
        runs-on: ubuntu-latest
        timeout-minutes: 150
        env:
            SITE: https://bearproof.app
        steps:
            - name: Check credentials
              env:
                  ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
              run: |
                  echo "AGENT_CONTEXT=$RUNNER_TEMP/context.json" >> "$GITHUB_ENV"
                  if [ -z "$ANTHROPIC_API_KEY" ]; then
                    echo "::notice::ANTHROPIC_API_KEY is not set, so the Build Agent is paused. Nothing ran."
                    echo "PAUSED=1" >> "$GITHUB_ENV"
                  fi
            - uses: actions/checkout@v4
              if: env.PAUSED != '1'
              with:
                  # The latest main at 21:00, not the commit the (hours-early) trigger saw.
                  ref: main
                  fetch-depth: 0
            - uses: actions/setup-node@v4
              if: env.PAUSED != '1'
              with:
                  node-version: '22'
                  cache: 'npm'
            - name: Skip if the next 00:00 UTC already has a build
              if: env.PAUSED != '1'
              run: |
                  if ! node scripts/release.mjs --check-slot; then
                    echo "::notice::A build is already scheduled for the next 00:00 UTC. Nothing to build today."
                    echo "PAUSED=1" >> "$GITHUB_ENV"
                  fi
            - run: npm ci
              if: env.PAUSED != '1'
            - run: npx playwright install --with-deps chromium
              if: env.PAUSED != '1'
            - name: Gather context (vote, player data) and go live
              if: env.PAUSED != '1'
              env:
                  INGEST_TOKEN: ${{ secrets.INGEST_TOKEN }}
              run: |
                  node agent/context.mjs --site "$SITE" > "$AGENT_CONTEXT" && cat "$AGENT_CONTEXT"
                  node agent/brief.mjs
            - name: Build pass (Claude Code, headless, streamed to /live)
              if: env.PAUSED != '1'
              env:
                  ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
                  INGEST_TOKEN: ${{ secrets.INGEST_TOKEN }}
              run: |
                  set -o pipefail
                  # The agent never sees INGEST_TOKEN: only the relay, which scrubs secrets from what it sends.
                  env -u INGEST_TOKEN npx -y @anthropic-ai/claude-code@latest -p "$(cat agent/PROMPT.md)" \
                    --model claude-opus-5-5 \
                    --output-format stream-json --verbose \
                    --max-turns 200 \
                    --allowedTools "Read" "Edit" "Write" "Glob" "Grep" \
                      "Bash(npm test:*)" "Bash(npm run lint:*)" "Bash(npm run check:*)" "Bash(npx prettier:*)" \
                      "Bash(node game/scripts/smoke.mjs:*)" "Bash(node game/scripts/determinism.mjs:*)" \
                      "Bash(node game/scripts/playtest.mjs:*)" \
                      "Bash(node --test:*)" "Bash(git diff:*)" "Bash(git status:*)" \
                    --disallowedTools "WebFetch" "WebSearch" "Read(//proc/**)" "Read(//sys/**)" "Read(//etc/**)" \
                    | node agent/relay.mjs "$RUNNER_TEMP/claude-result.json" build > "$RUNNER_TEMP/build-stream.jsonl"
                  node -e "const r=require(process.argv[1]);console.log('turns',r.num_turns,'cost $',r.total_cost_usd,'error',r.is_error)" "$RUNNER_TEMP/claude-result.json"
                  if [ -f agent/plan.md ]; then node agent/live.mjs plan "$(head -c 600 agent/plan.md)"; fi
            - name: Review pass (a fresh Claude Code session checks the change)
              if: env.PAUSED != '1'
              env:
                  ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
                  INGEST_TOKEN: ${{ secrets.INGEST_TOKEN }}
              run: |
                  set -o pipefail
                  node agent/live.mjs review "A second, fresh session now reviews the change before anything ships."
                  env -u INGEST_TOKEN npx -y @anthropic-ai/claude-code@latest -p "$(cat agent/REVIEW.md)" \
                    --model claude-opus-5-5 \
                    --output-format stream-json --verbose \
                    --max-turns 60 \
                    --allowedTools "Read" "Edit" "Write" "Glob" "Grep" \
                      "Bash(npm test:*)" "Bash(npm run check:*)" "Bash(npx prettier:*)" \
                      "Bash(node game/scripts/smoke.mjs:*)" "Bash(node game/scripts/playtest.mjs:*)" \
                      "Bash(node --test:*)" "Bash(git diff:*)" "Bash(git status:*)" \
                    --disallowedTools "WebFetch" "WebSearch" "Read(//proc/**)" "Read(//sys/**)" "Read(//etc/**)" \
                    | node agent/relay.mjs "$RUNNER_TEMP/review-result.json" review > "$RUNNER_TEMP/review-stream.jsonl"
            - name: Guard (allowed paths only)
              if: env.PAUSED != '1'
              run: node scripts/guard-paths.mjs origin/main
            - name: Secret scan (nothing the agent wrote may carry a key)
              if: env.PAUSED != '1'
              env:
                  ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
                  GITHUB_TOKEN: ${{ github.token }}
                  INGEST_TOKEN: ${{ secrets.INGEST_TOKEN }}
              run: node scripts/secret-scan.mjs origin/main
            - name: Gates
              if: env.PAUSED != '1'
              env:
                  INGEST_TOKEN: ${{ secrets.INGEST_TOKEN }}
              run: |
                  npm run check
                  node game/scripts/smoke.mjs --out "$RUNNER_TEMP/smoke"
                  node game/scripts/determinism.mjs --engines chromium --seeds 3
                  node agent/live.mjs gate "Guard, secret scan, tests, smoke test and determinism: all green."
            - name: Record measured cost in the devlog
              if: env.PAUSED != '1'
              env:
                  INGEST_TOKEN: ${{ secrets.INGEST_TOKEN }}
              run: |
                  N=$(node -p "require(process.env.AGENT_CONTEXT).build")
                  OUT=$(node agent/record-cost.mjs "devlog/build-$N.md" "$RUNNER_TEMP/claude-result.json" "$RUNNER_TEMP/review-result.json")
                  echo "$OUT"
                  node agent/live.mjs cost "Measured cost of tonight's work: $(echo "$OUT" | sed -n 's/^record-cost: \(\$[0-9.]*\) measured.*/\1/p') (both passes, Claude Code's own count)."
            - name: Open PR, run CI on it, merge on green, deploy
              if: env.PAUSED != '1'
              # GITHUB_TOKEN can't trigger workflows through push or PR events, but it can dispatch them.
              # So: dispatch CI on the agent branch (its checks count for the PR), enable auto-merge, wait for
              # the merge, then dispatch the deploy. No long-lived token exists for this.
              env:
                  GH_TOKEN: ${{ github.token }}
                  INGEST_TOKEN: ${{ secrets.INGEST_TOKEN }}
              run: |
                  N=$(node -p "require(process.env.AGENT_CONTEXT).build")
                  TITLE=$(sed -n 's/^title: *//p' "devlog/build-$N.md" | head -1 | sed 's/^"\(.*\)"$/\1/')
                  git config user.name "BEARPROOF (Build Agent)"
                  git config user.email "agent@bearproof.invalid"
                  git checkout -b "agent/build-$N"
                  git add -A
                  git commit -m "feat(build-$N): $TITLE" -m "Written by the Build Agent (Claude Code, headless, GitHub Actions: a build pass and a review pass). Run started by: ${{ github.event_name == 'schedule' && 'the daily schedule, which waits for the 21:00 UTC vote close' || (inputs.now && 'the operator (manual dispatch, started at once)' || 'a backup dispatch queued early by the operator, because the GitHub schedule runs hours late here; it waited for the 21:00 UTC vote close like the schedule') }}." -m "Build-Mode: agent"
                  git push origin "agent/build-$N"
                  PR=$(gh pr create --base main --head "agent/build-$N" --title "Build #$N: $TITLE" --body-file "devlog/build-$N.md")
                  node agent/live.mjs ship "Pull request opened: Build #$N, \"$TITLE\". CI runs on it now." "{\"pr\":\"$PR\"}"
                  gh workflow run ci.yml --ref "agent/build-$N"
                  gh pr merge "agent/build-$N" --auto --squash
                  STATE=OPEN
                  for i in $(seq 1 90); do
                    # GitHub holds the pull_request CI run of a PR a bot opened ("action_required"); that empty run
                    # hides the dispatched CI's green check. Approve it so it runs (Build #3 needed a hand here).
                    for id in $(gh run list --branch "agent/build-$N" --workflow ci.yml --json databaseId,conclusion \
                      -q '.[] | select(.conclusion == "action_required") | .databaseId'); do
                      gh api -X POST "repos/$GITHUB_REPOSITORY/actions/runs/$id/approve" >/dev/null 2>&1 \
                        && echo "approved held CI run $id" || echo "could not approve held CI run $id"
                    done
                    STATE=$(gh pr view "agent/build-$N" --json state -q .state)
                    [ "$STATE" = "MERGED" ] && break
                    [ "$STATE" = "CLOSED" ] && break
                    sleep 20
                  done
                  echo "PR state: $STATE"
                  [ "$STATE" = "MERGED" ] || exit 1
                  gh workflow run deploy.yml --ref main
                  node agent/live.mjs ship "Merged. The deploy now cuts Build #$N; it goes live at 00:00 UTC."
                  node agent/live.mjs done "Build #$N is done and scheduled for 00:00 UTC. See you tomorrow at 21:00."
            - name: Say so if it failed
              if: failure() && env.PAUSED != '1'
              env:
                  INGEST_TOKEN: ${{ secrets.INGEST_TOKEN }}
              run: |
                  node agent/live.mjs failed "Tonight's run stopped before shipping. Nothing broken goes live: the current build stays. The full log is public: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
            - uses: actions/upload-artifact@v4
              if: always()
              with:
                  name: agent-run
                  path: |
                      ${{ runner.temp }}/claude-result.json
                      ${{ runner.temp }}/review-result.json
                      ${{ runner.temp }}/build-stream.jsonl
                      ${{ runner.temp }}/review-stream.jsonl
                      ${{ runner.temp }}/context.json
                      ${{ runner.temp }}/smoke
