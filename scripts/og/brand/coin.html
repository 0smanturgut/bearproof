<!doctype html>
<html>
    <head>
        <meta charset="utf-8" />
        <style>
            html,
            body {
                margin: 0;
                width: 1000px;
                height: 1000px;
                background: #06080b;
                overflow: hidden;
            }
            .c {
                position: absolute;
                inset: 70px;
                border-radius: 50%;
                background:
                    radial-gradient(circle at 50% 42%, rgba(22, 224, 138, 0.28), transparent 60%),
                    linear-gradient(#131a22 2px, transparent 2px) 0 0 / 40px 40px,
                    linear-gradient(90deg, #131a22 2px, transparent 2px) 0 0 / 40px 40px,
                    #0b1016;
                box-shadow:
                    0 0 0 26px #16e08a,
                    0 0 0 34px #0a7a48,
                    0 0 0 48px #06261f,
                    0 0 90px 40px rgba(22, 224, 138, 0.25);
                display: grid;
                place-items: center;
            }
            canvas {
                image-rendering: pixelated;
                filter: drop-shadow(0 18px 0 rgba(0, 0, 0, 0.45))
                    drop-shadow(0 0 40px rgba(22, 224, 138, 0.4));
                margin-top: -10px;
            }
        </style>
    </head>
    <body>
        <div class="c"><canvas id="m"></canvas></div>
        <script type="module">
            import { bakeSprite } from '/scripts/og/lib/scene.js';
            const f = bakeSprite('emblem_large', 18)[0];
            const c = document.getElementById('m');
            c.width = f.width;
            c.height = f.height;
            c.getContext('2d').drawImage(f, 0, 0);
            window.ready = true;
        </script>
    </body>
</html>
