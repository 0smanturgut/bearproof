<!doctype html>
<html>
    <head>
        <meta charset="utf-8" />
        <style>
            /* Build #22's Daily twist, Options Expiry, on the day it is the Daily (14 Oct 2026, /api/daily): every XP
               candle expires 6 s after it drops and is worth +50%. The candle is the game's own xp_candle_big; the
               ring is the countdown the build draws on every candle on that twist, green, then red for the last 2 s,
               here frozen with 2 s left. */
            @font-face {
                font-family: 'Jersey 10';
                src: url('/hq/assets/fonts/jersey-10.woff2') format('woff2');
            }
            @font-face {
                font-family: 'JetBrains Mono';
                src: url('/hq/assets/fonts/jetbrains-mono-400.woff2') format('woff2');
            }
            * {
                box-sizing: border-box;
            }
            html,
            body {
                margin: 0;
                width: 1200px;
                height: 1500px;
                overflow: hidden;
                background: #05080f;
                color: #f4f8fb;
                font-family: 'Jersey 10', monospace;
            }
            canvas {
                image-rendering: pixelated;
            }
            .bg {
                position: absolute;
                inset: 0;
                background:
                    linear-gradient(rgba(255, 255, 255, 0.035) 2px, transparent 2px) 0 0 / 60px 60px,
                    linear-gradient(90deg, rgba(255, 255, 255, 0.035) 2px, transparent 2px) 0 0 /
                        60px 60px,
                    radial-gradient(ellipse 50% 36% at 50% 52%, #2a0c14, #05080f 75%);
            }
            #ring,
            #candle {
                position: absolute;
            }
            #ring {
                left: 0;
                top: 0;
            }
            .top {
                position: absolute;
                left: 64px;
                right: 64px;
                top: 60px;
                height: 72px;
                display: flex;
                align-items: center;
                justify-content: space-between;
            }
            .brand {
                display: flex;
                align-items: center;
                gap: 18px;
                font-size: 66px;
                line-height: 1;
                letter-spacing: 0.04em;
            }
            .pill {
                padding: 2px 24px 4px;
                background: #ff3b5c;
                color: #05080f;
                font-size: 56px;
                line-height: 1.1;
                letter-spacing: 0.05em;
                box-shadow:
                    0 0 0 4px #05080f,
                    0 0 0 8px #ff3b5c,
                    0 0 40px rgba(255, 59, 92, 0.5);
            }
            h1 {
                position: absolute;
                left: 0;
                right: 0;
                top: 170px;
                margin: 0;
                text-align: center;
                font-weight: 400;
                font-size: 200px;
                line-height: 0.84;
                text-shadow: 9px 9px 0 #101826;
            }
            h1 span {
                color: #ff3b5c;
                text-shadow:
                    9px 9px 0 #3d0a16,
                    0 0 60px rgba(255, 59, 92, 0.45);
            }
            .sec {
                position: absolute;
                left: 0;
                right: 0;
                top: 1210px;
                text-align: center;
                font-size: 112px;
                line-height: 1;
            }
            .sec b {
                font-weight: 400;
                color: #16e08a;
            }
            .sec i {
                font-style: normal;
                color: #ff3b5c;
            }
            .small {
                position: absolute;
                left: 0;
                right: 0;
                top: 1400px;
                text-align: center;
                font:
                    400 24px/1 'JetBrains Mono',
                    monospace;
                letter-spacing: 0.16em;
                color: #b8c4d2;
            }
        </style>
    </head>
    <body>
        <div class="bg"></div>
        <canvas id="ring" width="1200" height="1500"></canvas>
        <canvas id="candle"></canvas>
        <div class="top">
            <div class="brand"><canvas id="mark"></canvas>BEARPROOF</div>
            <div class="pill">TODAY'S DAILY</div>
        </div>
        <h1>USE IT OR<br /><span>LOSE IT.</span></h1>
        <div class="sec"><i>6 SECONDS</i> · <b>+50% XP</b></div>
        <div class="small">BUILD #22 · OPTIONS EXPIRY · EVERY XP CANDLE EXPIRES</div>
        <script type="module">
            import { put } from '/scripts/og/x/x.js';
            const $ = (id) => document.getElementById(id);
            await document.fonts.ready;
            await Promise.all(
                ["40px 'Jersey 10'", "40px 'JetBrains Mono'"].map((f) => document.fonts.load(f))
            );
            put($('mark'), 'emblem', 2000, { max: 4, glow: false });
            const CX = 600,
                CY = 800,
                R = 300;
            const c = $('ring').getContext('2d');
            // the empty track, then what is left of the 6 s: 2 s, red, like the build's last 2 s
            c.lineWidth = 46;
            c.strokeStyle = 'rgba(255,255,255,0.08)';
            c.beginPath();
            c.arc(CX, CY, R, 0, Math.PI * 2);
            c.stroke();
            c.save();
            c.shadowColor = '#ff3b5c';
            c.shadowBlur = 50;
            c.strokeStyle = '#ff3b5c';
            c.beginPath();
            c.arc(CX, CY, R, -Math.PI / 2, -Math.PI / 2 + (Math.PI * 2 * 2) / 6);
            c.stroke();
            c.restore();
            // ticks for the six seconds
            for (let i = 0; i < 6; i++) {
                const a = -Math.PI / 2 + (i / 6) * Math.PI * 2;
                c.fillStyle = '#05080f';
                c.save();
                c.translate(CX + Math.cos(a) * R, CY + Math.sin(a) * R);
                c.rotate(a);
                c.fillRect(-26, -5, 52, 10);
                c.restore();
            }
            const k = $('candle');
            put(k, 'xp_candle_big', 380, { max: 24, glow: true });
            k.style.left = CX - k.width / 2 + 'px';
            k.style.top = CY - k.height / 2 + 'px';
            window.ready = true;
        </script>
    </body>
</html>
