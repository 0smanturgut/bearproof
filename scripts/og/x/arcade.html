<!doctype html>
<html>
    <head>
        <meta charset="utf-8" />
        <link rel="stylesheet" href="/scripts/og/x/x.css" />
        <style>
            /* A Daily Challenge board as an arcade cabinet's high-score screen. Filled from ?d= with the board
               (/api/leaderboard?date=…) at a stated time: {kicker, stamp, rows:[{rank,name,score,time}], side:[
               {big, small}], foot}. Nothing on it that the board doesn't say. */
            html,
            body {
                background: radial-gradient(
                    ellipse 60% 70% at 50% 45%,
                    #1a1030 0%,
                    #0a0714 60%,
                    #050309 100%
                );
            }
            .cab {
                position: absolute;
                left: 60px;
                top: 50px;
                width: 1040px;
                height: 800px;
                border-radius: 28px;
                background: linear-gradient(180deg, #23262d, #15171b 60%, #0e0f12);
                box-shadow:
                    inset 0 2px 0 rgba(255, 255, 255, 0.08),
                    0 40px 90px rgba(0, 0, 0, 0.7);
            }
            .screen {
                position: absolute;
                left: 40px;
                top: 40px;
                right: 40px;
                bottom: 40px;
                border-radius: 36px / 30px;
                overflow: hidden;
                background: radial-gradient(
                    ellipse 90% 85% at 50% 50%,
                    #081410 0%,
                    #030806 75%,
                    #010302 100%
                );
                box-shadow:
                    inset 0 0 0 4px #050505,
                    inset 0 0 80px rgba(0, 0, 0, 0.9),
                    0 0 40px rgba(22, 224, 138, 0.12);
            }
            .scan {
                position: absolute;
                inset: 0;
                background: repeating-linear-gradient(
                    180deg,
                    rgba(0, 0, 0, 0.28) 0 2px,
                    transparent 2px 4px
                );
                pointer-events: none;
            }
            .glare {
                position: absolute;
                inset: 0;
                background: radial-gradient(
                    ellipse 60% 35% at 30% 10%,
                    rgba(255, 255, 255, 0.07),
                    transparent 70%
                );
            }
            .in {
                position: absolute;
                inset: 34px 50px;
                font-family: 'Jersey 10';
                color: #7dffc3;
                text-shadow:
                    0 0 6px rgba(55, 227, 154, 0.8),
                    0 0 18px rgba(55, 227, 154, 0.35);
            }
            .top {
                display: flex;
                justify-content: space-between;
                font-size: 26px;
                letter-spacing: 0.12em;
                color: #9ad8ff;
                text-shadow: 0 0 8px rgba(154, 216, 255, 0.6);
            }
            .title {
                margin-top: 10px;
                text-align: center;
                font-size: 74px;
                line-height: 1;
                letter-spacing: 0.06em;
                color: #ffe066;
                text-shadow:
                    0 0 8px rgba(255, 224, 102, 0.9),
                    0 0 30px rgba(255, 180, 40, 0.45);
            }
            table {
                width: 100%;
                margin-top: 16px;
                border-collapse: collapse;
                font-size: 35px;
                line-height: 1;
            }
            th {
                font-weight: 400;
                font-size: 24px;
                letter-spacing: 0.14em;
                color: #9ad8ff;
                text-shadow: 0 0 8px rgba(154, 216, 255, 0.6);
                text-align: left;
                padding-bottom: 6px;
            }
            td {
                padding: 2px 0;
                white-space: nowrap;
            }
            td.r,
            th.r {
                text-align: right;
            }
            tr.g1 td {
                color: #ffe066;
                text-shadow:
                    0 0 8px rgba(255, 224, 102, 0.9),
                    0 0 22px rgba(255, 180, 40, 0.4);
            }
            tr.g2 td {
                color: #e3edf7;
                text-shadow: 0 0 8px rgba(227, 237, 247, 0.7);
            }
            tr.g3 td {
                color: #ffb77d;
                text-shadow: 0 0 8px rgba(255, 183, 125, 0.7);
            }
            td .tag {
                margin-left: 14px;
                font-size: 22px;
                letter-spacing: 0.1em;
                color: #ff7ab8;
                text-shadow: 0 0 8px rgba(255, 122, 184, 0.8);
            }
            .press {
                position: absolute;
                left: 0;
                right: 0;
                bottom: -8px;
                text-align: center;
                font-size: 28px;
                letter-spacing: 0.16em;
                color: #7dffc3;
            }
            .side {
                position: absolute;
                left: 1130px;
                right: 50px;
                top: 60px;
                bottom: 60px;
                display: flex;
                flex-direction: column;
                gap: 18px;
            }
            .brand {
                position: static;
            }
            .card {
                padding: 18px 20px 16px;
                border-radius: 14px;
                background: rgba(20, 16, 36, 0.9);
                box-shadow: inset 0 0 0 2px rgba(255, 224, 102, 0.18);
            }
            .card b {
                display: block;
                font: 400 58px/0.9 'Jersey 10';
                color: #ffe066;
            }
            .card span {
                display: block;
                margin-top: 8px;
                font-size: 18px;
                line-height: 1.35;
                color: #c9c3dd;
            }
            .foot {
                position: absolute;
                left: 60px;
                right: 60px;
                bottom: 14px;
                display: block;
                text-align: center;
                font-size: 17px;
                color: #8a82a3;
                letter-spacing: 0.02em;
            }
        </style>
    </head>
    <body>
        <div class="cab">
            <div class="screen">
                <div class="in">
                    <div class="top"><span id="kicker"></span><span id="stamp"></span></div>
                    <div class="title">TODAY'S HIGH SCORES</div>
                    <table>
                        <thead>
                            <tr>
                                <th style="width: 110px">RANK</th>
                                <th>NAME</th>
                                <th class="r">SCORE</th>
                                <th class="r" style="width: 170px">TIME</th>
                            </tr>
                        </thead>
                        <tbody id="rows"></tbody>
                    </table>
                    <div class="press">PRESS START · BEARPROOF.APP</div>
                </div>
                <div class="scan"></div>
                <div class="glare"></div>
            </div>
        </div>
        <div class="side" id="side"><div class="brand">BEARPROOF</div></div>
        <div class="foot" id="foot"></div>
        <script type="module">
            import { brand, ready } from '/scripts/og/x/x.js';
            brand(document.querySelector('.brand'));
            const d = JSON.parse(new URLSearchParams(location.search).get('d') || '{}');
            const $ = (id) => document.getElementById(id);
            $('kicker').textContent = d.kicker || '';
            $('stamp').textContent = d.stamp || '';
            $('foot').textContent = d.foot || '';
            const ord = (n) => n + (n === 1 ? 'ST' : n === 2 ? 'ND' : n === 3 ? 'RD' : 'TH');
            for (const r of d.rows || []) {
                const tr = document.createElement('tr');
                if (r.rank <= 3) tr.className = 'g' + r.rank;
                const cells = [ord(r.rank), r.name, r.score, r.time];
                cells.forEach((v, i) => {
                    const td = document.createElement('td');
                    td.textContent = v;
                    if (i >= 2) td.className = 'r';
                    if (i === 1 && r.tag) {
                        const t = document.createElement('span');
                        t.className = 'tag';
                        t.textContent = r.tag;
                        td.append(t);
                    }
                    tr.append(td);
                });
                $('rows').append(tr);
            }
            for (const s of d.side || []) {
                const c = document.createElement('div');
                c.className = 'card';
                const b = document.createElement('b');
                b.textContent = s.big;
                const sp = document.createElement('span');
                sp.textContent = s.small;
                c.append(b, sp);
                $('side').append(c);
            }
            await ready();
        </script>
    </body>
</html>
