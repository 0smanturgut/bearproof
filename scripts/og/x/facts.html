<!doctype html>
<html>
    <head>
        <meta charset="utf-8" />
        <link rel="stylesheet" href="/scripts/og/x/x.css" />
        <style>
            /* A day's Daily Challenge as the facts panel on the side of a box. Data comes in ?d=<json>:
               { serving, rows: [[label, value, class?], ...] (class "ind" indents, "thick" ends a group), warn,
               note, ingredients, sticker: [line1, line2], side }.
               Everything is read from /api/daily, the game's content.js and the build's devlog. */
            html,
            body {
                width: 1200px;
                height: 1500px;
                background: radial-gradient(
                    ellipse 80% 60% at 30% 20%,
                    #23e79a 0%,
                    #16c97c 45%,
                    #0e9a5c 100%
                );
                color: #111;
                font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif;
            }
            .dots {
                position: absolute;
                inset: 0;
                background: radial-gradient(rgba(0, 0, 0, 0.13) 1.6px, transparent 2px) 0 0 / 16px
                    16px;
                -webkit-mask-image: linear-gradient(200deg, transparent 30%, #000 100%);
            }
            .side {
                position: absolute;
                left: 46px;
                top: 60px;
                bottom: 60px;
                width: 150px;
                writing-mode: vertical-rl;
                transform: rotate(180deg);
                font: 400 150px/0.9 'Jersey 10';
                letter-spacing: 0.02em;
                color: #06261f;
                opacity: 0.9;
                text-align: center;
            }
            .label {
                position: absolute;
                left: 232px;
                top: 60px;
                width: 800px;
                padding: 18px 26px 22px;
                background: #fff;
                border: 5px solid #111;
                box-shadow: 16px 18px 0 rgba(0, 0, 0, 0.35);
            }
            .label h1 {
                margin: 0;
                font:
                    900 112px/0.95 'Helvetica Neue',
                    'Arial Black',
                    sans-serif;
                letter-spacing: -0.02em;
            }
            .srv {
                margin-top: 6px;
                padding-bottom: 8px;
                font:
                    500 28px/1.25 'Helvetica Neue',
                    sans-serif;
                border-bottom: 20px solid #111;
            }
            .srv b {
                font-weight: 800;
            }
            .per {
                padding: 6px 0 4px;
                font:
                    800 24px/1 'Helvetica Neue',
                    sans-serif;
                border-bottom: 2px solid #111;
            }
            .row {
                display: flex;
                justify-content: space-between;
                align-items: baseline;
                gap: 18px;
                padding: 9px 0 8px;
                border-bottom: 2px solid #111;
                font:
                    500 31px/1.15 'Helvetica Neue',
                    sans-serif;
            }
            .row b {
                font-weight: 900;
            }
            .row span:last-child {
                text-align: right;
                font-weight: 800;
            }
            .row.ind {
                padding-left: 34px;
                font-size: 28px;
            }
            .row.thick {
                border-bottom-width: 12px;
            }
            .warn {
                margin-top: 12px;
                padding: 12px 16px;
                border: 4px solid #111;
                font:
                    900 31px/1.16 'Helvetica Neue',
                    'Arial Black',
                    sans-serif;
            }
            .warn i {
                font-style: normal;
                color: #d92d27;
            }
            .note {
                margin-top: 10px;
                font:
                    500 21px/1.3 'Helvetica Neue',
                    sans-serif;
            }
            .ing {
                margin-top: 12px;
                padding-top: 10px;
                border-top: 6px solid #111;
                font:
                    500 23px/1.3 'Helvetica Neue',
                    sans-serif;
            }
            .ing b {
                font-weight: 900;
            }
            .sticker {
                position: absolute;
                right: 38px;
                top: 86px;
                width: 236px;
                height: 236px;
                border-radius: 50%;
                background: #ffd400;
                border: 6px solid #111;
                display: grid;
                place-items: center;
                text-align: center;
                transform: rotate(12deg);
                box-shadow: 8px 10px 0 rgba(0, 0, 0, 0.35);
                font:
                    900 34px/1 'Helvetica Neue',
                    'Arial Black',
                    sans-serif;
                letter-spacing: -0.01em;
            }
            .sticker small {
                display: block;
                margin-top: 8px;
                font:
                    800 20px/1.1 'Helvetica Neue',
                    sans-serif;
                letter-spacing: 0.04em;
            }
            #bull {
                position: absolute;
                right: 46px;
                bottom: 150px;
                filter: drop-shadow(10px 10px 0 rgba(0, 0, 0, 0.35));
            }
            .price {
                position: absolute;
                right: 40px;
                bottom: 60px;
                padding: 10px 16px 6px;
                background: #111;
                color: #fff;
                font: 400 54px/1 'Jersey 10';
                transform: rotate(-4deg);
            }
            .price i {
                font-style: normal;
                color: #23e79a;
            }
        </style>
    </head>
    <body>
        <div class="dots"></div>
        <div class="side" id="side"></div>
        <div class="label">
            <h1>Daily Facts</h1>
            <div class="srv" id="srv"></div>
            <div class="per">Amount per run</div>
            <div id="rows"></div>
            <div class="warn" id="warn"></div>
            <div class="note" id="note"></div>
            <div class="ing" id="ing"></div>
        </div>
        <div class="sticker" id="sticker"></div>
        <canvas id="bull"></canvas>
        <div class="price">PRICE: <i>FREE</i></div>
        <script type="module">
            import { put, ready } from '/scripts/og/x/x.js';
            const D = JSON.parse(new URLSearchParams(location.search).get('d'));
            const $ = (id) => document.getElementById(id);
            $('side').textContent = D.side;
            $('srv').innerHTML = D.serving;
            $('rows').innerHTML = D.rows
                .map(
                    ([l, v, cls]) =>
                        `<div class="row ${cls || ''}"><span>${l}</span><span>${v}</span></div>`
                )
                .join('');
            $('warn').innerHTML = D.warn;
            $('note').innerHTML = D.note;
            $('ing').innerHTML = D.ingredients;
            $('sticker').innerHTML = `<div>${D.sticker[0]}<small>${D.sticker[1]}</small></div>`;
            put($('bull'), 'bull', 1000, { max: 5, glow: false });
            await ready();
        </script>
    </body>
</html>
