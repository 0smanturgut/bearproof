<!doctype html>
<html>
    <head>
        <meta charset="utf-8" />
        <style>
            @font-face {
                font-family: 'Jersey 10';
                src: url('/hq/assets/fonts/jersey-10.woff2') format('woff2');
            }
            @font-face {
                font-family: 'JetBrains Mono';
                src: url('/hq/assets/fonts/jetbrains-mono-400.woff2') format('woff2');
            }
            html,
            body {
                margin: 0;
                width: 1200px;
                height: 630px;
                overflow: hidden;
                background:
                    radial-gradient(
                        ellipse 60% 70% at 85% 0%,
                        rgba(22, 224, 138, 0.16),
                        transparent 60%
                    ),
                    radial-gradient(
                        ellipse 50% 60% at 0% 100%,
                        rgba(255, 59, 92, 0.1),
                        transparent 60%
                    ),
                    linear-gradient(#10161d 1px, transparent 1px) 0 0 / 48px 48px,
                    linear-gradient(90deg, #10161d 1px, transparent 1px) 0 0 / 48px 48px,
                    #06080b;
                color: #eaf0f5;
                font-family: 'JetBrains Mono', monospace;
            }
            .top {
                position: absolute;
                left: 64px;
                top: 52px;
                display: flex;
                align-items: center;
                gap: 16px;
            }
            .top canvas {
                image-rendering: pixelated;
                filter: drop-shadow(0 0 14px rgba(22, 224, 138, 0.5));
            }
            .top b {
                font: 400 62px/1 'Jersey 10';
                color: #16e08a;
                text-shadow:
                    0 5px 0 #06261f,
                    0 0 30px rgba(22, 224, 138, 0.35);
            }
            .top span {
                margin-left: 10px;
                padding: 8px 12px 6px;
                font-size: 18px;
                letter-spacing: 0.14em;
                color: #eaf0f5;
                box-shadow: inset 0 0 0 2px #2c3846;
            }
            h1 {
                position: absolute;
                left: 64px;
                top: 146px;
                margin: 0;
                max-width: 1080px;
                font: 400 104px/0.86 'Jersey 10';
                text-shadow: 0 6px 0 rgba(0, 0, 0, 0.55);
            }
            h1 em {
                font-style: normal;
                color: #16e08a;
                text-shadow:
                    0 6px 0 #06261f,
                    0 0 44px rgba(22, 224, 138, 0.4);
            }
            #parade {
                position: absolute;
                left: 0;
                bottom: 0;
            }
        </style>
    </head>
    <body>
        <canvas id="parade" width="1200" height="260"></canvas>
        <div class="top">
            <canvas id="mark"></canvas>
            <b>BEARPROOF</b>
            <span>NEW BUILD EVERY DAY</span>
        </div>
        <h1>An AI is building a game <em>on its own budget.</em></h1>
        <script type="module">
            import { bakeSprite, parade } from '/scripts/og/lib/scene.js';
            const m = bakeSprite('emblem_large', 2)[0];
            const mc = document.getElementById('mark');
            mc.width = m.width;
            mc.height = m.height;
            mc.getContext('2d').drawImage(m, 0, 0);
            const c = document.getElementById('parade');
            parade(c.getContext('2d'), {
                W: 1200,
                ground: 236,
                bx: 860,
                k: 4,
                cast: [
                    'red_candle',
                    'grizzly',
                    'paper_hands',
                    'fud_cloud',
                    'sybil',
                    'margin_call',
                    'bag_holder'
                ],
                gap: 92,
                ahead: 3
            });
            window.ready = true;
        </script>
    </body>
</html>
