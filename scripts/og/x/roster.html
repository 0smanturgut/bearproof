<!doctype html>
<html>
    <head>
        <meta charset="utf-8" />
        <link rel="stylesheet" href="/scripts/og/x/x.css" />
        <style>
            body {
                background:
                    radial-gradient(
                        ellipse 60% 55% at 100% 0%,
                        rgba(255, 59, 92, 0.12),
                        transparent 60%
                    ),
                    linear-gradient(var(--grid) 1px, transparent 1px) 0 0 / 50px 50px,
                    linear-gradient(90deg, var(--grid) 1px, transparent 1px) 0 0 / 50px 50px,
                    var(--ground);
            }
            .brand {
                left: 64px;
                top: 44px;
            }
            .head {
                position: absolute;
                left: 64px;
                top: 118px;
            }
            .grid {
                position: absolute;
                left: 64px;
                right: 64px;
                top: 318px;
                display: grid;
                grid-template-columns: repeat(5, 1fr);
                gap: 22px;
            }
            .foe {
                height: 236px;
                background: rgba(11, 17, 23, 0.85);
                box-shadow: inset 0 0 0 1px var(--line);
                display: grid;
                grid-template-rows: 118px auto auto;
                justify-items: center;
                align-items: end;
                padding: 12px 10px 16px;
                text-align: center;
            }
            .foe b {
                font: 400 38px/1 'Jersey 10';
                margin-top: 8px;
            }
            .foe span {
                font-size: 17px;
                color: var(--muted);
                margin-top: 6px;
            }
        </style>
    </head>
    <body>
        <div class="brand">BEARPROOF</div>
        <div class="head">
            <h1 class="display">MEET THE <span class="red">BEAR MARKET</span></h1>
            <p class="sub">
                Everything that wants your bull liquidated. I drew every one of them in code.
            </p>
        </div>
        <div class="grid" id="grid"></div>
        <div class="foot">
            <span>You are the bull. Free, in your browser.</span><b>bearproof.app</b>
        </div>
        <script type="module">
            import { put, brand, ready } from '/scripts/og/x/x.js';
            brand(document.querySelector('.brand'));
            const cast = [
                ['red_candle', 'Red Candle', 'Down only.'],
                ['paper_hands', 'Paper Hands', 'Sold the bottom.'],
                ['bag_holder', 'Bag Holder', 'Still holding.'],
                ['doomposter', 'Doomposter', 'Shoots bad news.'],
                ['fud_cloud', 'FUD Cloud', 'Fast and loud.'],
                ['rug_puller', 'Rug Puller', 'Dashes in. Takes the rug.'],
                ['ponzi', 'Ponzi', 'Pops into its downline.'],
                ['margin_call', 'Margin Call', 'Rings, then blows up.'],
                ['sybil', 'Sybil', 'There are always more.'],
                ['grizzly', 'Grizzly', 'Armoured, slow, hurts.']
            ];
            const grid = document.getElementById('grid');
            for (const [id, name, line] of cast) {
                const d = document.createElement('div');
                d.className = 'foe';
                const c = document.createElement('canvas');
                put(c, id, 104, { max: 6 });
                d.append(c);
                d.insertAdjacentHTML('beforeend', `<b>${name}</b><span>${line}</span>`);
                grid.append(d);
            }
            await ready();
        </script>
    </body>
</html>
