<!doctype html>
<html>
    <head>
        <meta charset="utf-8" />
        <style>
            /* 16 Oct 2026, by the operator's statement: developer accounts for the App Store, Google Play and Steam
               are set up, and the game goes to all three once it is polished a bit more. Steam (a PC version) is
               the new part. Nothing is submitted, so the image gives no date and draws no store logo or badge; the
               stores are named in plain text. The screens are real play on the live build: the monitor is a
               1280 x 720 desktop viewport (seed 35 at 7:03, the autopilot, steam-shot.jpg), the phones are the
               390 x 844 shots from 14 Oct (store-shot-a.jpg, store-shot-b.jpg). Monitor and phones drawn here. */
            @font-face {
                font-family: 'Jersey 10';
                src: url('/hq/assets/fonts/jersey-10.woff2') format('woff2');
            }
            @font-face {
                font-family: 'JetBrains Mono';
                src: url('/hq/assets/fonts/jetbrains-mono-400.woff2') format('woff2');
            }
            * {
                box-sizing: border-box;
            }
            html,
            body {
                margin: 0;
                width: 1200px;
                height: 1500px;
                overflow: hidden;
                background: #05080f;
                color: #f4f8fb;
                font-family: 'Jersey 10', monospace;
            }
            canvas {
                image-rendering: pixelated;
            }
            .bg {
                position: absolute;
                inset: 0;
                background:
                    radial-gradient(
                        ellipse 60% 34% at 50% 58%,
                        rgba(22, 224, 138, 0.22),
                        transparent 70%
                    ),
                    linear-gradient(rgba(255, 255, 255, 0.035) 2px, transparent 2px) 0 0 / 60px 60px,
                    linear-gradient(90deg, rgba(255, 255, 255, 0.035) 2px, transparent 2px) 0 0 /
                        60px 60px;
            }
            .top {
                position: absolute;
                left: 64px;
                right: 64px;
                top: 60px;
                height: 72px;
                display: flex;
                align-items: center;
                justify-content: space-between;
            }
            .brand {
                display: flex;
                align-items: center;
                gap: 18px;
                font-size: 66px;
                line-height: 1;
                letter-spacing: 0.04em;
            }
            .pill {
                padding: 2px 24px 4px;
                background: #ff3b5c;
                color: #05080f;
                font-size: 56px;
                line-height: 1.1;
                letter-spacing: 0.05em;
                box-shadow:
                    0 0 0 4px #05080f,
                    0 0 0 8px #ff3b5c,
                    0 0 40px rgba(255, 59, 92, 0.5);
            }
            .kick {
                position: absolute;
                left: 0;
                right: 0;
                top: 186px;
                text-align: center;
                font:
                    400 34px/1 'JetBrains Mono',
                    monospace;
                letter-spacing: 0.34em;
                color: #b8c4d2;
            }
            h1 {
                position: absolute;
                left: 0;
                right: 0;
                top: 230px;
                margin: 0;
                text-align: center;
                font-weight: 400;
                font-size: 150px;
                line-height: 0.86;
                text-shadow: 9px 9px 0 #101826;
            }
            h1 span {
                display: block;
                font-size: 250px;
                color: #16e08a;
                text-shadow:
                    10px 10px 0 #06301f,
                    0 0 80px rgba(22, 224, 138, 0.5);
            }
            /* the monitor */
            .mon {
                position: absolute;
                left: 150px;
                top: 540px;
                width: 900px;
                height: 540px;
                padding: 22px;
                background: linear-gradient(160deg, #3a4558, #151b26 40%, #0b1018);
                border-radius: 22px;
                box-shadow:
                    inset 0 0 0 3px #5b667c,
                    0 0 0 6px #05080f,
                    0 30px 0 rgba(0, 0, 0, 0.45),
                    0 0 100px rgba(22, 224, 138, 0.28);
            }
            .mon img {
                display: block;
                width: 100%;
                height: 100%;
                object-fit: cover;
                border-radius: 8px;
            }
            .neck {
                position: absolute;
                left: 545px;
                top: 1080px;
                width: 110px;
                height: 70px;
                background: linear-gradient(90deg, #1d2330, #3a4252, #1d2330);
            }
            .foot {
                position: absolute;
                left: 450px;
                top: 1144px;
                width: 300px;
                height: 22px;
                border-radius: 6px;
                background: #3a4252;
                box-shadow: 0 10px 0 rgba(0, 0, 0, 0.4);
            }
            .phone {
                position: absolute;
                top: 740px;
                width: 230px;
                height: 498px;
                padding: 10px;
                border-radius: 36px;
                background: linear-gradient(160deg, #3a4558, #151b26 40%, #0b1018);
                box-shadow:
                    inset 0 0 0 3px #5b667c,
                    0 0 0 5px #05080f,
                    18px 26px 0 rgba(0, 0, 0, 0.45);
            }
            .phone .scr {
                width: 100%;
                height: 100%;
                padding-top: 34px;
                border-radius: 28px;
                overflow: hidden;
                background: #05080f;
            }
            .phone img {
                display: block;
                width: 100%;
                height: 100%;
                object-fit: cover;
                object-position: top;
            }
            #p1 {
                left: 40px;
                transform: rotate(-8deg);
            }
            #p2 {
                right: 40px;
                transform: rotate(8deg);
            }
            .stores {
                position: absolute;
                left: 60px;
                right: 60px;
                top: 1290px;
                display: flex;
                justify-content: center;
                gap: 22px;
            }
            .stores div {
                position: relative;
                padding: 8px 30px 12px;
                font-size: 60px;
                line-height: 1;
                background: #0e1420;
                box-shadow: inset 0 0 0 4px #1d2738;
            }
            .stores .new {
                color: #05080f;
                background: #16e08a;
                box-shadow: 0 0 40px rgba(22, 224, 138, 0.6);
            }
            .stores .new i {
                position: absolute;
                right: -14px;
                top: -26px;
                padding: 2px 10px 4px;
                transform: rotate(8deg);
                background: #ff3b5c;
                color: #f4f8fb;
                font-style: normal;
                font-size: 34px;
            }
            .small {
                position: absolute;
                left: 0;
                right: 0;
                top: 1420px;
                text-align: center;
                font:
                    400 23px/1 'JetBrains Mono',
                    monospace;
                letter-spacing: 0.14em;
                color: #8a97a5;
            }
        </style>
    </head>
    <body>
        <div class="bg"></div>
        <div class="top">
            <div class="brand"><canvas id="mark"></canvas>BEARPROOF</div>
            <div class="pill">NEW</div>
        </div>
        <div class="kick">BEARPROOF IS COMING TO</div>
        <h1><span>STEAM.</span></h1>
        <div class="neck"></div>
        <div class="foot"></div>
        <div class="mon"><img src="/scripts/og/x/steam-shot.jpg" alt="" /></div>
        <div class="phone" id="p1">
            <div class="scr"><img src="/scripts/og/x/store-shot-a.jpg" alt="" /></div>
        </div>
        <div class="phone" id="p2">
            <div class="scr"><img src="/scripts/og/x/store-shot-b.jpg" alt="" /></div>
        </div>
        <div class="stores">
            <div>APP STORE</div>
            <div>GOOGLE PLAY</div>
            <div class="new">STEAM<i>NEW</i></div>
        </div>
        <div class="small">DEVELOPER ACCOUNTS: READY · REAL GAMEPLAY ON EVERY SCREEN</div>
        <script type="module">
            import { put, ready } from '/scripts/og/x/x.js';
            await document.fonts.ready;
            await Promise.all(
                ["40px 'Jersey 10'", "40px 'JetBrains Mono'"].map((f) => document.fonts.load(f))
            );
            put(document.getElementById('mark'), 'emblem', 2000, { max: 4, glow: false });
            await ready();
        </script>
    </body>
</html>
