<!doctype html>
<html>
    <head>
        <meta charset="utf-8" />
        <link rel="stylesheet" href="/scripts/og/x/x.css" />
        <style>
            /* The first $ANSEM prize. Filled from the query string after the payout lands:
               ?day=2&date=24 SEP&name=…&score=…&time=20:00&amount=…&sol=…&tx=<short sig> */
            body {
                background:
                    radial-gradient(
                        ellipse 60% 70% at 50% 40%,
                        rgba(245, 197, 66, 0.14),
                        transparent 62%
                    ),
                    linear-gradient(var(--grid) 1px, transparent 1px) 0 0 / 50px 50px,
                    linear-gradient(90deg, var(--grid) 1px, transparent 1px) 0 0 / 50px 50px,
                    var(--ground);
            }
            .brand {
                left: 64px;
                top: 44px;
            }
            .c {
                position: absolute;
                inset: 0;
                display: grid;
                place-content: center;
                justify-items: center;
                text-align: center;
                gap: 18px;
            }
            .kicker {
                font: 400 38px/1 'Jersey 10';
                letter-spacing: 0.1em;
                color: var(--gold);
            }
            .display {
                font-size: 128px;
            }
            .amt {
                font: 400 110px/1 'Jersey 10';
                color: var(--gold);
                text-shadow:
                    0 7px 0 #3a2a06,
                    0 0 50px rgba(245, 197, 66, 0.4);
            }
            .who {
                display: flex;
                gap: 16px;
                font-size: 26px;
                color: #cfd8e0;
            }
            .who span {
                padding: 10px 16px 8px;
                box-shadow: inset 0 0 0 1px var(--line);
                background: rgba(8, 12, 16, 0.9);
            }
            .who b {
                color: var(--text);
                font-weight: 600;
            }
            .flow {
                display: flex;
                align-items: center;
                gap: 14px;
                font: 400 34px/1 'Jersey 10';
                color: var(--text);
            }
            .flow span {
                padding: 10px 16px 8px;
                box-shadow: inset 0 0 0 2px #1d3b30;
            }
            .flow i {
                font-style: normal;
                color: var(--green);
            }
            .tx {
                font-size: 20px;
                color: var(--muted);
            }
            .tx b {
                color: var(--green);
                font-weight: 400;
            }
        </style>
    </head>
    <body>
        <div class="brand">BEARPROOF</div>
        <div class="c">
            <canvas id="bull"></canvas>
            <div class="kicker" id="kicker"></div>
            <h1 class="display"><span id="t1"></span> <span class="green" id="t2"></span></h1>
            <div class="amt" id="amt"></div>
            <div class="who">
                <span><b id="f1"></b></span><span><b id="f2"></b></span><span><b id="f3"></b></span>
            </div>
            <div class="flow">
                <span id="w1"></span><i>→</i><span id="w2"></span><i>→</i><span id="w3"></span>
            </div>
            <div class="tx" id="foot"></div>
        </div>
        <script type="module">
            import { put, brand, ready } from '/scripts/og/x/x.js';
            brand(document.querySelector('.brand'));
            put(document.getElementById('bull'), 'bull', 150, { max: 6, frame: 1 });
            const q = new URLSearchParams(location.search);
            for (const id of [
                'kicker',
                't1',
                't2',
                'amt',
                'f1',
                'f2',
                'f3',
                'w1',
                'w2',
                'w3',
                'foot'
            ])
                document.getElementById(id).textContent = q.get(id) || '';
            await ready();
        </script>
    </body>
</html>
