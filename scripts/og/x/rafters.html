<!doctype html>
<html>
    <head>
        <meta charset="utf-8" />
        <link rel="stylesheet" href="/scripts/og/x/x.css" />
        <style>
            /* Every Daily champion so far as championship banners in an arena's rafters. /api/winners (3 Oct 00:55
               UTC): 24 Sep xxx 222,261 · 25 Sep xxx 193,849 · 26 Sep Tzae 331,443 · 27 Sep Tzae 298,799 · 28 Sep Tzae
               314,685 · 29 Sep Tzae 267,328 · 30 Sep Yuki 284,612 · 1 Oct Yuki 288,590 · 2 Oct Yuki 372,766 (the
               highest winning score; the 2 Oct board, 28 players). */
            html,
            body {
                width: 1200px;
                height: 1500px;
                background:
                    radial-gradient(
                        ellipse 30% 40% at 77% 52%,
                        rgba(255, 236, 170, 0.22),
                        transparent 70%
                    ),
                    radial-gradient(
                        ellipse 60% 30% at 50% 0%,
                        rgba(120, 150, 210, 0.14),
                        transparent 70%
                    ),
                    linear-gradient(180deg, #0a0e18 0%, #070a12 60%, #05070c 100%);
            }
            .haze {
                position: absolute;
                inset: 0;
                background: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='300' height='300'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.012' numOctaves='3' stitchTiles='stitch'/><feColorMatrix values='0 0 0 0 0.75 0 0 0 0 0.8 0 0 0 0 0.9 0 0 0 0.09 0'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>");
                pointer-events: none;
            }
            .cone {
                position: absolute;
                left: 927px;
                top: 0;
                width: 760px;
                height: 1100px;
                margin-left: -380px;
                background: linear-gradient(
                    180deg,
                    rgba(255, 240, 190, 0.2),
                    rgba(255, 240, 190, 0.02) 90%,
                    transparent
                );
                clip-path: polygon(44% 0, 56% 0, 100% 100%, 0 100%);
                pointer-events: none;
            }
            svg.truss {
                position: absolute;
                left: 0;
                top: 0;
            }
            .row {
                position: absolute;
                left: 0;
                right: 0;
                display: flex;
                justify-content: center;
            }
            .bn {
                position: relative;
                display: flex;
                flex-direction: column;
                align-items: center;
                padding-top: 16px;
                color: #fff;
                text-align: center;
                clip-path: polygon(0 0, 100% 0, 100% 100%, 50% 90%, 0 100%);
                box-shadow:
                    inset 0 0 0 6px rgba(255, 255, 255, 0.92),
                    inset 0 0 0 12px rgba(0, 0, 0, 0.18);
            }
            .bn::before {
                content: '';
                position: absolute;
                left: 0;
                right: 0;
                top: 0;
                height: 100%;
                background:
                    linear-gradient(
                        90deg,
                        rgba(0, 0, 0, 0.22),
                        transparent 18%,
                        transparent 82%,
                        rgba(0, 0, 0, 0.26)
                    ),
                    repeating-linear-gradient(
                        90deg,
                        rgba(255, 255, 255, 0.03) 0 3px,
                        transparent 3px 9px
                    );
                pointer-events: none;
            }
            .bn small {
                display: block;
                font:
                    800 15px/1.1 'Avenir Next Condensed',
                    sans-serif;
                letter-spacing: 0.18em;
            }
            .bn b {
                display: block;
                margin-top: 10px;
                font: 400 52px/0.9 'Jersey 10';
                letter-spacing: 0.02em;
            }
            .bn .d {
                margin-top: 10px;
                font:
                    800 22px/1 'Avenir Next Condensed',
                    sans-serif;
                letter-spacing: 0.12em;
            }
            .bn .s {
                margin-top: 8px;
                font: 400 30px/1 'Jersey 10';
                color: #ffe39a;
            }
            .bn canvas {
                margin-top: 8px;
            }
            .row.one .bn {
                width: 154px;
                height: 330px;
                margin: 0 9px;
            }
            .row.two .bn {
                width: 284px;
                height: 520px;
                margin: 0 22px;
                padding-top: 28px;
            }
            .row.two .bn small {
                font-size: 21px;
            }
            .row.two .bn b {
                font-size: 96px;
                margin-top: 16px;
            }
            .row.two .bn .d {
                font-size: 32px;
                margin-top: 16px;
            }
            .row.two .bn .s {
                font-size: 50px;
                margin-top: 12px;
            }
            .x {
                background: linear-gradient(180deg, #2c6fd6, #1b4a9a);
            }
            .t {
                background: linear-gradient(180deg, #d01c3a, #8f0f25);
            }
            .y {
                background: linear-gradient(180deg, #14b673, #0a6b44);
            }
            .rec {
                position: absolute;
                left: 50%;
                bottom: 62px;
                transform: translateX(-50%) rotate(-4deg);
                padding: 8px 14px 5px;
                background: #ffd23f;
                color: #3b2700;
                font:
                    800 22px/1 'Avenir Next Condensed',
                    sans-serif;
                letter-spacing: 0.12em;
                white-space: nowrap;
                box-shadow: 0 4px 0 rgba(0, 0, 0, 0.3);
            }
            .glow {
                filter: drop-shadow(0 0 30px rgba(255, 226, 140, 0.55));
            }
            .head {
                position: absolute;
                left: 0;
                right: 0;
                bottom: 120px;
                text-align: center;
            }
            .head h1 {
                margin: 0;
                font: 400 140px/0.86 'Jersey 10';
                color: #fff;
                text-shadow: 0 7px 0 rgba(0, 0, 0, 0.6);
            }
            .head h1 em {
                font-style: normal;
                color: #ffd23f;
            }
            .head p {
                margin: 16px 0 0;
                font:
                    600 30px/1.3 'Avenir Next Condensed',
                    sans-serif;
                letter-spacing: 0.04em;
                color: #c9d3e2;
            }
            .src {
                position: absolute;
                left: 0;
                right: 0;
                bottom: 40px;
                text-align: center;
                font:
                    400 19px/1 'JetBrains Mono',
                    monospace;
                letter-spacing: 0.1em;
                color: #7d8aa0;
            }
        </style>
    </head>
    <body>
        <div class="cone"></div>
        <svg class="truss" width="1200" height="620" viewBox="0 0 1200 620">
            <g stroke="#3b465a" stroke-width="5" fill="none">
                <path d="M0 52 H1200 M0 92 H1200" />
                <path
                    d="M0 52 L40 92 L80 52 L120 92 L160 52 L200 92 L240 52 L280 92 L320 52 L360 92 L400 52 L440 92 L480 52 L520 92 L560 52 L600 92 L640 52 L680 92 L720 52 L760 92 L800 52 L840 92 L880 52 L920 92 L960 52 L1000 92 L1040 52 L1080 92 L1120 52 L1160 92 L1200 52"
                    stroke-width="3"
                />
                <path d="M0 492 H1200 M0 528 H1200" />
                <path
                    d="M0 492 L36 528 L72 492 L108 528 L144 492 L180 528 L216 492 L252 528 L288 492 L324 528 L360 492 L396 528 L432 492 L468 528 L504 492 L540 528 L576 492 L612 528 L648 492 L684 528 L720 492 L756 528 L792 492 L828 528 L864 492 L900 528 L936 492 L972 528 L1008 492 L1044 528 L1080 492 L1116 528 L1152 492 L1188 528"
                    stroke-width="3"
                />
            </g>
        </svg>
        <div class="row one" style="top: 92px" id="r1"></div>
        <div class="row two" style="top: 528px" id="r2"></div>
        <div class="head">
            <h1>THREE IN<br />A <em>ROW.</em></h1>
            <p>Every Daily champion so far, one banner per day</p>
        </div>
        <div class="src">BEARPROOF · THE DAILY BOARDS, 24 SEP – 2 OCT · FREE TO PLAY</div>
        <div class="haze"></div>
        <script type="module">
            import { put, ready } from '/scripts/og/x/x.js';
            const ONE = [
                ['x', 'xxx', '24 SEP', '222,261'],
                ['x', 'xxx', '25 SEP', '193,849'],
                ['t', 'Tzae', '26 SEP', '331,443'],
                ['t', 'Tzae', '27 SEP', '298,799'],
                ['t', 'Tzae', '28 SEP', '314,685'],
                ['t', 'Tzae', '29 SEP', '267,328']
            ];
            const TWO = [
                ['y', 'Yuki', '30 SEP', '284,612'],
                ['y', 'Yuki', '1 OCT', '288,590'],
                ['y glow', 'Yuki', '2 OCT', '372,766', true]
            ];
            const banner = (row, [c, name, date, score, rec], k) => {
                const d = document.createElement('div');
                d.className = 'bn ' + c;
                d.innerHTML = `<small>DAILY<br />CHAMPION</small><b>${name}</b><div class="d">${date}</div><div class="s">${score}</div>`;
                const em = document.createElement('canvas');
                put(em, 'emblem_large', 200, { max: k, glow: false });
                d.append(em);
                if (rec) d.insertAdjacentHTML('beforeend', '<div class="rec">HIGHEST YET</div>');
                document.getElementById(row).append(d);
            };
            ONE.forEach((b) => banner('r1', b, 2));
            TWO.forEach((b) => banner('r2', b, 3));
            await ready();
        </script>
    </body>
</html>
