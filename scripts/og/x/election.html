<!doctype html>
<html>
    <head>
        <meta charset="utf-8" />
        <link rel="stylesheet" href="/scripts/og/x/x.css" />
        <style>
            /* The holder vote as an election-night broadcast graphic. Filled from ?d= with /api/vote at a stated
               time: {kicker, title, stamp, rows:[{sprite, name, tag, share, voters, lead}], foot}. The bars are
               vote weight (floor(sqrt(tokens held))), the counts are wallets. */
            html,
            body {
                background:
                    radial-gradient(
                        ellipse 70% 60% at 70% 0%,
                        rgba(80, 120, 255, 0.22),
                        transparent 70%
                    ),
                    linear-gradient(180deg, #0a1030 0%, #070b20 60%, #04061a 100%);
            }
            .stripe {
                position: absolute;
                left: 0;
                right: 0;
                top: 0;
                height: 10px;
                background: linear-gradient(90deg, #16e08a, #f5c542, #ff5a7a, #5a8cff);
            }
            .brand {
                left: 56px;
                top: 40px;
            }
            .live {
                position: absolute;
                right: 56px;
                top: 44px;
                display: flex;
                align-items: center;
                gap: 12px;
                font: 400 30px/1 'Jersey 10';
                letter-spacing: 0.12em;
                color: #fff;
            }
            .live i {
                width: 16px;
                height: 16px;
                border-radius: 50%;
                background: #ff3b5c;
                box-shadow: 0 0 14px rgba(255, 59, 92, 0.9);
            }
            .head {
                position: absolute;
                left: 56px;
                right: 56px;
                top: 112px;
            }
            .kicker {
                font: 400 30px/1 'Jersey 10';
                letter-spacing: 0.14em;
                color: #9fb4ff;
            }
            h1 {
                margin: 10px 0 0;
                font: 400 96px/0.9 'Jersey 10';
                color: #fff;
                text-shadow: 0 6px 0 rgba(0, 0, 0, 0.5);
            }
            h1 em {
                font-style: normal;
                color: #ffcf4a;
            }
            .rows {
                position: absolute;
                left: 56px;
                right: 56px;
                top: 300px;
                display: grid;
                gap: 14px;
            }
            .row {
                display: grid;
                grid-template-columns: 110px 1fr 170px;
                align-items: center;
                gap: 20px;
                padding: 12px 18px 12px 12px;
                border-radius: 14px;
                background: rgba(16, 24, 64, 0.85);
                box-shadow: inset 0 0 0 2px rgba(159, 180, 255, 0.14);
            }
            .row.lead {
                background: rgba(40, 34, 10, 0.9);
                box-shadow:
                    inset 0 0 0 3px #ffcf4a,
                    0 0 40px rgba(255, 207, 74, 0.2);
            }
            .pic {
                width: 110px;
                height: 96px;
                border-radius: 10px;
                display: grid;
                place-items: center;
                background:
                    radial-gradient(
                        ellipse 60% 60% at 50% 60%,
                        rgba(159, 180, 255, 0.2),
                        transparent 70%
                    ),
                    #070b20;
                box-shadow: inset 0 0 0 2px rgba(255, 255, 255, 0.08);
            }
            .nm {
                display: flex;
                align-items: baseline;
                gap: 14px;
                font: 400 44px/1 'Jersey 10';
                color: #fff;
            }
            .nm small {
                font: 400 22px/1 'Jersey 10';
                letter-spacing: 0.1em;
                padding: 5px 9px 3px;
                border-radius: 6px;
                color: #0a1030;
                background: #9fb4ff;
            }
            .nm small.p {
                background: #ffcf4a;
            }
            .nm small.h {
                background: #ff8fb1;
            }
            .nm small.a {
                background: #16e08a;
            }
            .nm .lead-tag {
                font: 400 24px/1 'Jersey 10';
                letter-spacing: 0.12em;
                color: #ffcf4a;
            }
            .bar {
                margin-top: 12px;
                height: 18px;
                border-radius: 9px;
                background: rgba(255, 255, 255, 0.08);
                overflow: hidden;
            }
            .bar i {
                display: block;
                height: 100%;
                border-radius: 9px;
                background: linear-gradient(90deg, #5a8cff, #9fb4ff);
            }
            .row.lead .bar i {
                background: linear-gradient(90deg, #f5a524, #ffcf4a);
            }
            .num {
                text-align: right;
                font: 400 64px/0.9 'Jersey 10';
                color: #fff;
            }
            .num span {
                display: block;
                margin-top: 6px;
                font:
                    400 20px/1 'JetBrains Mono',
                    monospace;
                color: #9fb4ff;
            }
            .foot {
                position: absolute;
                left: 56px;
                right: 56px;
                bottom: 30px;
                display: flex;
                justify-content: space-between;
                font-size: 18px;
                color: #8d9bd6;
            }
        </style>
    </head>
    <body>
        <div class="stripe"></div>
        <div class="brand">BEARPROOF</div>
        <div class="live"><i></i><span id="stamp"></span></div>
        <div class="head">
            <div class="kicker" id="kicker"></div>
            <h1 id="title"></h1>
        </div>
        <div class="rows" id="rows"></div>
        <div class="foot" id="foot"></div>
        <script type="module">
            import { put, brand, ready } from '/scripts/og/x/x.js';
            brand(document.querySelector('.brand'));
            const d = JSON.parse(new URLSearchParams(location.search).get('d') || '{}');
            const $ = (id) => document.getElementById(id);
            $('kicker').textContent = d.kicker || '';
            $('title').innerHTML = d.title || '';
            $('stamp').textContent = d.stamp || '';
            $('foot').innerHTML = d.foot || '';
            const TAG = {
                player: ['p', "PLAYER'S IDEA"],
                holder: ['h', "HOLDER'S REQUEST"],
                ai: ['a', "THE AI'S PICK"]
            };
            for (const r of d.rows || []) {
                const row = document.createElement('div');
                row.className = 'row' + (r.lead ? ' lead' : '');
                const pic = document.createElement('div');
                pic.className = 'pic';
                const c = document.createElement('canvas');
                put(c, r.sprite, r.box || 84, { max: r.max || 4, icon: !!r.icon });
                pic.append(c);
                const mid = document.createElement('div');
                const [cls, label] = TAG[r.tag] || ['', ''];
                mid.innerHTML = `<div class="nm"></div><div class="bar"><i style="width:${Math.max(0, Math.min(100, r.share))}%"></i></div>`;
                const nm = mid.querySelector('.nm');
                nm.append(document.createTextNode(r.name));
                const sm = document.createElement('small');
                sm.className = cls;
                sm.textContent = label;
                nm.append(sm);
                if (r.lead) {
                    const lt = document.createElement('span');
                    lt.className = 'lead-tag';
                    lt.textContent = '▲ LEADING';
                    nm.append(lt);
                }
                const num = document.createElement('div');
                num.className = 'num';
                num.innerHTML = `${r.share.toFixed(0)}%<span>${r.voters} wallet${r.voters === 1 ? '' : 's'}</span>`;
                row.append(pic, mid, num);
                $('rows').append(row);
            }
            await ready();
        </script>
    </body>
</html>
