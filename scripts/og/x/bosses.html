<!doctype html>
<html>
    <head>
        <meta charset="utf-8" />
        <link rel="stylesheet" href="/scripts/og/x/x.css" />
        <style>
            body {
                background:
                    radial-gradient(
                        ellipse 70% 60% at 50% 100%,
                        rgba(255, 59, 92, 0.18),
                        transparent 65%
                    ),
                    linear-gradient(var(--grid) 1px, transparent 1px) 0 0 / 50px 50px,
                    linear-gradient(90deg, var(--grid) 1px, transparent 1px) 0 0 / 50px 50px,
                    var(--ground);
            }
            .brand {
                left: 64px;
                top: 44px;
            }
            .head {
                position: absolute;
                left: 64px;
                top: 118px;
            }
            .row {
                position: absolute;
                left: 40px;
                right: 40px;
                bottom: 96px;
                display: grid;
                grid-template-columns: repeat(5, 1fr);
                gap: 16px;
                align-items: end;
            }
            .boss {
                display: grid;
                justify-items: center;
                text-align: center;
                gap: 8px;
            }
            .boss canvas {
                margin-bottom: 6px;
            }
            .boss b {
                font: 400 44px/0.9 'Jersey 10';
                color: var(--red);
                text-shadow: 0 4px 0 #3a0a14;
            }
            .boss span {
                font-size: 18px;
                color: #c9d2dc;
                min-height: 2.6em;
            }
        </style>
    </head>
    <body>
        <div class="brand">BEARPROOF</div>
        <div class="head">
            <h1 class="display">PICK YOUR <span class="red">NIGHTMARE</span></h1>
            <p class="sub">Five bosses. One bull. A game an AI ships a new build of every night.</p>
        </div>
        <div class="row" id="row"></div>
        <script type="module">
            import { put, brand, ready } from '/scripts/og/x/x.js';
            brand(document.querySelector('.brand'));
            const bosses = [
                ['rug_lord', 'Rug Lord', 'He is pulling everything.'],
                ['capitulation', 'Capitulation', 'The biggest red candle you have ever seen.'],
                ['liquidation', 'Liquidation', 'Your position is being closed.'],
                ['long_winter', 'The Long Winter', 'Crypto winter has a face.'],
                ['bear_market', 'The Bear Market', 'Survive this and the cycle turns.']
            ];
            const row = document.getElementById('row');
            for (const [id, name, line] of bosses) {
                const d = document.createElement('div');
                d.className = 'boss';
                const c = document.createElement('canvas');
                put(c, id, 290, { max: 7 });
                d.append(c);
                d.insertAdjacentHTML('beforeend', `<b>${name}</b><span>${line}</span>`);
                row.append(d);
            }
            await ready();
        </script>
    </body>
</html>
