<!doctype html>
<html>
    <head>
        <meta charset="utf-8" />
        <style>
            /* The coin's supply, burned. On-chain, 15 Oct 2026 13:00 UTC (getTokenSupply): 931,073,314.70 of the
               1,000,000,000 minted, so 68,926,685.30 are gone (6.89%). 62,646,554.32 of them went in PumpSwap's
               graduation buy-and-burn on 14 Oct, 21:39:06 to 21:44:48 UTC: MigrateV2 moved 17.58 SOL of the pool's
               SOL into a boost account (InitBoost) and a PumpSwap crank spent it in 27 BoostBuyAndBurn transactions.
               That was the protocol, not the operator; the image only says how much is gone, not who burned it.
               ?d=<json> { burned, pct, from, to }. */
            @font-face {
                font-family: 'Jersey 10';
                src: url('/hq/assets/fonts/jersey-10.woff2') format('woff2');
            }
            @font-face {
                font-family: 'JetBrains Mono';
                src: url('/hq/assets/fonts/jetbrains-mono-400.woff2') format('woff2');
            }
            * {
                box-sizing: border-box;
            }
            html,
            body {
                margin: 0;
                width: 1200px;
                height: 1500px;
                overflow: hidden;
                background: #05080f;
                color: #f4f8fb;
                font-family: 'Jersey 10', monospace;
            }
            canvas {
                image-rendering: pixelated;
            }
            #fire {
                position: absolute;
                left: 0;
                bottom: 0;
                width: 1200px;
                height: 900px;
            }
            .glow {
                position: absolute;
                inset: 0;
                background: radial-gradient(
                    ellipse 70% 40% at 50% 100%,
                    rgba(255, 106, 0, 0.35),
                    transparent 70%
                );
            }
            .top {
                position: absolute;
                left: 64px;
                right: 64px;
                top: 60px;
                height: 72px;
                display: flex;
                align-items: center;
                justify-content: space-between;
            }
            .brand {
                display: flex;
                align-items: center;
                gap: 18px;
                font-size: 66px;
                line-height: 1;
                letter-spacing: 0.04em;
            }
            .pill {
                padding: 2px 24px 4px;
                background: #ff6a00;
                color: #05080f;
                font-size: 56px;
                line-height: 1.1;
                letter-spacing: 0.05em;
                box-shadow:
                    0 0 0 4px #05080f,
                    0 0 0 8px #ff6a00,
                    0 0 40px rgba(255, 106, 0, 0.55);
            }
            .num {
                position: absolute;
                left: 0;
                right: 0;
                top: 190px;
                text-align: center;
                font-size: 330px;
                line-height: 0.84;
                color: #ffd36a;
                text-shadow:
                    0 10px 0 #b8400a,
                    0 20px 0 #3d1204,
                    0 0 90px rgba(255, 120, 20, 0.7);
            }
            .lab {
                position: absolute;
                left: 0;
                right: 0;
                top: 478px;
                text-align: center;
                font-size: 150px;
                line-height: 1;
                letter-spacing: 0.06em;
                text-shadow: 8px 8px 0 #3d1204;
            }
            .bar {
                position: absolute;
                left: 90px;
                right: 90px;
                top: 700px;
                height: 86px;
                display: flex;
                padding: 8px;
                background: #05080f;
                box-shadow:
                    0 0 0 5px #f4f8fb,
                    0 0 0 10px #05080f;
            }
            .bar .left {
                height: 100%;
                background:
                    repeating-linear-gradient(
                        90deg,
                        transparent 0 46px,
                        rgba(5, 8, 15, 0.5) 46px 52px
                    ),
                    linear-gradient(180deg, #9dffd2, #16e08a 50%, #0b8f56);
            }
            .bar .gone {
                height: 100%;
                background: repeating-linear-gradient(-45deg, #ff6a00 0 14px, #ffd36a 14px 28px);
                box-shadow: 0 0 40px rgba(255, 106, 0, 0.9);
            }
            .legend {
                position: absolute;
                left: 90px;
                right: 90px;
                top: 810px;
                display: flex;
                justify-content: space-between;
                font-size: 60px;
                line-height: 1;
            }
            .legend span {
                display: block;
                font:
                    400 22px/1.4 'JetBrains Mono',
                    monospace;
                letter-spacing: 0.18em;
                color: #b8c4d2;
            }
            .legend .r {
                text-align: right;
                color: #ffd36a;
            }
            .forever {
                position: absolute;
                left: 0;
                right: 0;
                top: 1300px;
                text-align: center;
                font-size: 120px;
                line-height: 1;
                letter-spacing: 0.08em;
                color: #f4f8fb;
                text-shadow:
                    6px 6px 0 #3d1204,
                    0 0 50px rgba(255, 106, 0, 0.8);
            }
        </style>
    </head>
    <body>
        <canvas id="fire" width="300" height="225"></canvas>
        <div class="glow"></div>
        <div class="top">
            <div class="brand"><canvas id="mark"></canvas>BEARPROOF</div>
            <div class="pill">SUPPLY</div>
        </div>
        <div class="num" id="num"></div>
        <div class="lab">BURNED</div>
        <div class="bar">
            <div class="left" id="left"></div>
            <div class="gone" id="gone"></div>
        </div>
        <div class="legend">
            <div><span>MINTED</span><b id="from"></b></div>
            <div class="r"><span>LEFT TODAY</span><b id="to"></b></div>
        </div>
        <div class="forever">GONE FOREVER.</div>
        <script type="module">
            import { put } from '/scripts/og/x/x.js';
            const $ = (id) => document.getElementById(id);
            await document.fonts.ready;
            await Promise.all(
                ["40px 'Jersey 10'", "40px 'JetBrains Mono'"].map((f) => document.fonts.load(f))
            );
            const D = JSON.parse(
                new URLSearchParams(location.search).get('d') ||
                    '{"burned":"68.9M","pct":6.89,"from":"1,000,000,000","to":"931,073,315"}'
            );
            put($('mark'), 'emblem', 2000, { max: 4, glow: false });
            $('num').textContent = D.burned;
            $('from').textContent = D.from;
            $('to').textContent = D.to;
            // the bar is the whole supply, and the burned share is drawn at its real size
            const shown = D.pct;
            $('left').style.width = `${100 - shown}%`;
            $('gone').style.width = `${shown}%`;
            // classic pixel fire (Doom-style), run to a steady state and drawn at 4x
            const W = 300,
                H = 225,
                c = $('fire').getContext('2d');
            const pal = [];
            for (let i = 0; i < 37; i++) {
                const t = i / 36;
                const r = Math.round(255 * Math.min(1, t * 2.2));
                const g = Math.round(255 * Math.max(0, Math.min(1, (t - 0.35) * 1.8)));
                const b = Math.round(255 * Math.max(0, (t - 0.85) * 6));
                pal.push([
                    r,
                    g,
                    Math.min(255, b),
                    i === 0 ? 0 : Math.round(255 * Math.min(1, t * 3))
                ]);
            }
            const px = new Uint8Array(W * H);
            for (let x = 0; x < W; x++) px[(H - 1) * W + x] = 36;
            let seed = 68;
            const rnd = () => (seed = (seed * 16807) % 2147483647) / 2147483647;
            for (let step = 0; step < 260; step++)
                for (let x = 0; x < W; x++)
                    for (let y = 1; y < H; y++) {
                        const src = y * W + x,
                            v = px[src];
                        if (!v) {
                            px[src - W] = 0;
                            continue;
                        }
                        const r = Math.round(rnd() * 3) & 3;
                        const dst = src - W - r + 1;
                        px[Math.max(0, dst)] = Math.max(0, v - (r & 1));
                    }
            const img = c.createImageData(W, H);
            for (let i = 0; i < px.length; i++) {
                const [r, g, b, a] = pal[px[i]];
                img.data.set([r, g, b, a], i * 4);
            }
            c.putImageData(img, 0, 0);
            window.ready = true;
        </script>
    </body>
</html>
