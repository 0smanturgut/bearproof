<!doctype html>
<html>
    <head>
        <meta charset="utf-8" />
        <style>
            /* A day's Daily Challenge board when the top is close: four rows, a tag on the ones with a story.
               Data: /api/leaderboard?date=<day> (verified runs) and the earlier days' boards for who is new.
               ?d=<json> { date, title: [line, line], rows: [[name, score, tag or 0]], note }. */
            @font-face {
                font-family: 'Jersey 10';
                src: url('/hq/assets/fonts/jersey-10.woff2') format('woff2');
            }
            @font-face {
                font-family: 'JetBrains Mono';
                src: url('/hq/assets/fonts/jetbrains-mono-400.woff2') format('woff2');
            }
            * {
                box-sizing: border-box;
            }
            html,
            body {
                margin: 0;
                width: 1200px;
                height: 1500px;
                overflow: hidden;
                background: #05080f;
                color: #f4f8fb;
                font-family: 'Jersey 10', monospace;
            }
            canvas {
                image-rendering: pixelated;
            }
            .bg {
                position: absolute;
                inset: 0;
                background:
                    linear-gradient(rgba(255, 255, 255, 0.035) 2px, transparent 2px) 0 0 / 60px 60px,
                    linear-gradient(90deg, rgba(255, 255, 255, 0.035) 2px, transparent 2px) 0 0 /
                        60px 60px,
                    radial-gradient(
                        ellipse 70% 40% at 50% 46%,
                        rgba(22, 224, 138, 0.18),
                        transparent 70%
                    );
            }
            .vig {
                position: absolute;
                inset: 0;
                background: radial-gradient(
                    ellipse 80% 74% at 50% 50%,
                    transparent 52%,
                    rgba(0, 0, 0, 0.8) 100%
                );
            }
            .top {
                position: absolute;
                left: 64px;
                right: 64px;
                top: 60px;
                height: 72px;
                display: flex;
                align-items: center;
                justify-content: space-between;
            }
            .brand {
                display: flex;
                align-items: center;
                gap: 18px;
                font-size: 66px;
                line-height: 1;
                letter-spacing: 0.04em;
            }
            .pill {
                display: flex;
                align-items: center;
                gap: 16px;
                padding: 2px 24px 4px 20px;
                background: #16e08a;
                color: #05080f;
                font-size: 56px;
                line-height: 1.1;
                letter-spacing: 0.05em;
                box-shadow:
                    0 0 0 4px #05080f,
                    0 0 0 8px #16e08a,
                    0 0 40px rgba(22, 224, 138, 0.5);
            }
            .pill i {
                width: 20px;
                height: 20px;
                background: #05080f;
            }
            h1 {
                position: absolute;
                left: 0;
                right: 0;
                top: 176px;
                margin: 0;
                text-align: center;
                font-weight: 400;
                font-size: 250px;
                line-height: 0.84;
                text-shadow: 10px 10px 0 #101826;
            }
            h1 span {
                color: #16e08a;
            }
            .rows {
                position: absolute;
                left: 60px;
                right: 60px;
                top: 640px;
                display: grid;
                gap: 22px;
            }
            .r {
                position: relative;
                height: 164px;
                display: flex;
                align-items: center;
                padding: 0 34px 8px;
                background: #0c1322;
                box-shadow: 0 0 0 5px #24304a;
                font-size: 120px;
                line-height: 1;
            }
            .r.new {
                background: linear-gradient(180deg, #7dffc4, #16e08a 45%, #0b8f56);
                color: #05080f;
                box-shadow:
                    0 0 0 5px #05080f,
                    0 0 0 10px #16e08a,
                    0 0 50px rgba(22, 224, 138, 0.4);
            }
            .r .k {
                width: 110px;
                opacity: 0.7;
            }
            .r .nm {
                flex: 1;
                white-space: nowrap;
            }
            .r .tag {
                position: absolute;
                right: 26px;
                top: -26px;
                padding: 0 16px 4px;
                background: #f5c542;
                color: #05080f;
                font-size: 50px;
                line-height: 1.1;
                box-shadow: 0 0 0 4px #05080f;
                transform: rotate(4deg);
            }
            .small {
                position: absolute;
                left: 0;
                right: 0;
                top: 1424px;
                text-align: center;
                font:
                    400 22px/1 'JetBrains Mono',
                    monospace;
                letter-spacing: 0.16em;
                color: #8a97a5;
            }
        </style>
    </head>
    <body>
        <div class="bg"></div>
        <div class="vig"></div>
        <div class="top">
            <div class="brand"><canvas id="mark"></canvas>BEARPROOF</div>
            <div class="pill" id="pill"></div>
        </div>
        <h1 id="h"></h1>
        <div class="rows" id="rows"></div>
        <div class="small" id="small"></div>
        <script type="module">
            import { put } from '/scripts/og/x/x.js';
            const $ = (id) => document.getElementById(id);
            await document.fonts.ready;
            await Promise.all(
                ["40px 'Jersey 10'", "40px 'JetBrains Mono'"].map((f) => document.fonts.load(f))
            );
            const D = JSON.parse(
                new URLSearchParams(location.search).get('d') ||
                    '{"date":"7 OCT","title":["PHOTO","FINISH"],"rows":[["YUKI","395,750","BACK ON TOP"],["JAY","394,223","1,527 SHORT"],["ZAIN","388,241","FIRST DAY"],["GREEDELF","344,739",0]],"note":"VERIFIED RUNS · THE TOP THREE FINISHED 7,509 POINTS APART"}'
            );
            put($('mark'), 'emblem', 2000, { max: 4, glow: false });
            $('h').innerHTML = `${D.title[0]}<br /><span>${D.title[1]}</span>`;
            $('pill').innerHTML = `<i></i>DAILY · ${D.date}`;
            D.rows.forEach(([name, score, fresh], i) =>
                $('rows').insertAdjacentHTML(
                    'beforeend',
                    `<div class="r${fresh ? ' new' : ''}"><span class="k">${i + 1}</span><span class="nm">${name}</span><span>${score}</span>${fresh ? `<span class="tag">${fresh}</span>` : ''}</div>`
                )
            );
            $('small').textContent = D.note;
            window.ready = true;
        </script>
    </body>
</html>
