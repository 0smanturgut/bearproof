name: Build Agent (daily)

# The Build Agent's daily loop: gather context → Claude Code (headless) implements one feature → guard → secret scan → gates →
# measured cost into the devlog → PR with auto-merge. Deploy (and the build tag) happen in deploy.yml on merge.
# A red gate means no PR; the run log and screenshots stay as artifacts and the devlog says what failed.

on:
    schedule:
        - cron: '0 13 * * *' # 13:00 UTC, leaving 11 h before the 00:00 UTC release
    workflow_dispatch:

permissions:
    contents: write # push the agent branch
    pull-requests: write # open the PR, enable auto-merge
    actions: write # dispatch CI on the branch and the deploy after merge

concurrency:
    group: build-agent
    cancel-in-progress: false

jobs:
    build:
        runs-on: ubuntu-latest
        timeout-minutes: 120
        env:
            SITE: https://bearproof.app
        steps:
            - name: Check credentials
              env:
                  ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
              run: |
                  echo "AGENT_CONTEXT=$RUNNER_TEMP/context.json" >> "$GITHUB_ENV"
                  if [ -z "$ANTHROPIC_API_KEY" ]; then
                    echo "::notice::ANTHROPIC_API_KEY is not set, so the Build Agent is paused. Nothing ran."
                    echo "PAUSED=1" >> "$GITHUB_ENV"
                  fi
            - uses: actions/checkout@v4
              if: env.PAUSED != '1'
              with:
                  fetch-depth: 0
            - uses: actions/setup-node@v4
              if: env.PAUSED != '1'
              with:
                  node-version: '22'
                  cache: 'npm'
            - name: Skip if the next 00:00 UTC already has a build
              if: env.PAUSED != '1'
              run: |
                  if ! node scripts/release.mjs --check-slot; then
                    echo "::notice::A build is already scheduled for the next 00:00 UTC. Nothing to build today."
                    echo "PAUSED=1" >> "$GITHUB_ENV"
                  fi
            - run: npm ci
              if: env.PAUSED != '1'
            - run: npx playwright install --with-deps chromium
              if: env.PAUSED != '1'
            - name: Gather context
              if: env.PAUSED != '1'
              run: node agent/context.mjs --site "$SITE" > "$AGENT_CONTEXT" && cat "$AGENT_CONTEXT"
            - name: The Build Agent builds today's feature (Claude Code, headless)
              if: env.PAUSED != '1'
              env:
                  ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
              run: |
                  npx -y @anthropic-ai/claude-code@latest -p "$(cat agent/PROMPT.md)" \
                    --model claude-opus-5 \
                    --output-format json \
                    --max-turns 150 \
                    --allowedTools "Read" "Edit" "Write" "Glob" "Grep" \
                      "Bash(npm test:*)" "Bash(npm run lint:*)" "Bash(npm run check:*)" "Bash(npx prettier:*)" \
                      "Bash(node game/scripts/smoke.mjs:*)" "Bash(node game/scripts/determinism.mjs:*)" \
                      "Bash(node --test:*)" "Bash(git diff:*)" "Bash(git status:*)" \
                    --disallowedTools "WebFetch" "WebSearch" "Read(//proc/**)" "Read(//sys/**)" "Read(//etc/**)" \
                    > "$RUNNER_TEMP/claude-result.json"
                  node -e "const r=require(process.argv[1]);console.log('turns',r.num_turns,'cost $',r.total_cost_usd,'error',r.is_error)" "$RUNNER_TEMP/claude-result.json"
            - name: Guard (allowed paths only)
              if: env.PAUSED != '1'
              run: node scripts/guard-paths.mjs origin/main
            - name: Secret scan (nothing the agent wrote may carry a key)
              if: env.PAUSED != '1'
              env:
                  ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
                  GITHUB_TOKEN: ${{ github.token }}
              run: node scripts/secret-scan.mjs origin/main
            - name: Gates
              if: env.PAUSED != '1'
              run: |
                  npm run check
                  node game/scripts/smoke.mjs --out "$RUNNER_TEMP/smoke"
                  node game/scripts/determinism.mjs --engines chromium --seeds 3
            - name: Record measured cost in the devlog
              if: env.PAUSED != '1'
              run: |
                  N=$(node -p "require(process.env.AGENT_CONTEXT).build")
                  node agent/record-cost.mjs "$RUNNER_TEMP/claude-result.json" "devlog/build-$N.md"
            - name: Open PR, run CI on it, merge on green, deploy
              if: env.PAUSED != '1'
              # GITHUB_TOKEN can't trigger workflows through push or PR events, but it can dispatch them.
              # So: dispatch CI on the agent branch (its checks count for the PR), enable auto-merge, wait for
              # the merge, then dispatch the deploy. No long-lived token exists for this.
              env:
                  GH_TOKEN: ${{ github.token }}
              run: |
                  N=$(node -p "require(process.env.AGENT_CONTEXT).build")
                  TITLE=$(sed -n 's/^title: *//p' "devlog/build-$N.md" | head -1 | sed 's/^"\(.*\)"$/\1/')
                  git config user.name "BEARPROOF (Build Agent)"
                  git config user.email "agent@bearproof.invalid"
                  git checkout -b "agent/build-$N"
                  git add -A
                  git commit -m "feat(build-$N): $TITLE" -m "Written by the Build Agent (Claude Code, headless, GitHub Actions). Run started by: ${{ github.event_name == 'schedule' && 'the daily 13:00 UTC schedule' || 'the operator (manual dispatch)' }}." -m "Build-Mode: agent"
                  git push origin "agent/build-$N"
                  gh pr create --base main --head "agent/build-$N" --title "Build #$N: $TITLE" --body-file "devlog/build-$N.md"
                  gh workflow run ci.yml --ref "agent/build-$N"
                  gh pr merge "agent/build-$N" --auto --squash
                  STATE=OPEN
                  for i in $(seq 1 90); do
                    STATE=$(gh pr view "agent/build-$N" --json state -q .state)
                    [ "$STATE" = "MERGED" ] && break
                    [ "$STATE" = "CLOSED" ] && break
                    sleep 20
                  done
                  echo "PR state: $STATE"
                  [ "$STATE" = "MERGED" ] || exit 1
                  gh workflow run deploy.yml --ref main
            - uses: actions/upload-artifact@v4
              if: always()
              with:
                  name: agent-run
                  path: |
                      ${{ runner.temp }}/claude-result.json
                      ${{ runner.temp }}/context.json
                      ${{ runner.temp }}/smoke
