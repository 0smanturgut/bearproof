<!doctype html>
<html>
    <head>
        <meta charset="utf-8" />
        <style>
            /* The Build #26 ballot as a game show's three doors, each open a crack on what's behind it. /api/vote,
               17 Oct 2026 12:21 UTC: Play as The Whale (a third character, unlocked with CLOUT), Crypto Winter Night
               (a fourth map, dark between candle flashes, a Frost Miner enemy), Missions (goals that pay CLOUT);
               closes 21:00 UTC; weight floor(sqrt(tokens)), 1,000 tokens minimum, one vote per wallet. None of the
               three is in the game yet. The whale and the candle are the game's own sprites; doors, snow and the
               checklist are drawn here. */
            @font-face {
                font-family: 'Jersey 10';
                src: url('/hq/assets/fonts/jersey-10.woff2') format('woff2');
            }
            @font-face {
                font-family: 'JetBrains Mono';
                src: url('/hq/assets/fonts/jetbrains-mono-400.woff2') format('woff2');
            }
            * {
                box-sizing: border-box;
            }
            html,
            body {
                margin: 0;
                width: 1200px;
                height: 1500px;
                overflow: hidden;
                background: #12061f;
                color: #f4f8fb;
                font-family: 'Jersey 10', monospace;
            }
            canvas {
                image-rendering: pixelated;
            }
            .stage {
                position: absolute;
                inset: 0;
                background:
                    radial-gradient(
                        ellipse 22% 60% at 18% 0%,
                        rgba(255, 230, 150, 0.16),
                        transparent 70%
                    ),
                    radial-gradient(
                        ellipse 22% 60% at 50% 0%,
                        rgba(255, 230, 150, 0.2),
                        transparent 70%
                    ),
                    radial-gradient(
                        ellipse 22% 60% at 82% 0%,
                        rgba(255, 230, 150, 0.16),
                        transparent 70%
                    ),
                    linear-gradient(180deg, #2a0f45 0%, #12061f 60%, #08030f 100%);
            }
            .floor {
                position: absolute;
                left: 0;
                right: 0;
                top: 1180px;
                bottom: 0;
                background: repeating-linear-gradient(90deg, #2a1640 0 100px, #1d0f2e 100px 200px);
                box-shadow: inset 0 10px 0 #f5c542;
            }
            .top {
                position: absolute;
                left: 64px;
                right: 64px;
                top: 60px;
                height: 72px;
                display: flex;
                align-items: center;
                justify-content: space-between;
            }
            .brand {
                display: flex;
                align-items: center;
                gap: 18px;
                font-size: 66px;
                line-height: 1;
                letter-spacing: 0.04em;
            }
            .pill {
                padding: 2px 24px 4px;
                background: #f5c542;
                color: #05080f;
                font-size: 56px;
                line-height: 1.1;
                letter-spacing: 0.05em;
                box-shadow:
                    0 0 0 4px #12061f,
                    0 0 0 8px #f5c542,
                    0 0 40px rgba(245, 197, 66, 0.5);
            }
            h1 {
                position: absolute;
                left: 0;
                right: 0;
                top: 170px;
                margin: 0;
                text-align: center;
                font-weight: 400;
                font-size: 176px;
                line-height: 0.86;
                text-shadow: 9px 9px 0 #2a0f45;
            }
            h1 span {
                color: #f5c542;
                text-shadow:
                    9px 9px 0 #3a2a08,
                    0 0 70px rgba(245, 197, 66, 0.5);
            }
            .door {
                position: absolute;
                top: 560px;
                width: 330px;
                height: 620px;
            }
            .frame {
                position: absolute;
                inset: 0;
                border-radius: 160px 160px 0 0;
                background: linear-gradient(180deg, #f5c542, #c8961e);
                box-shadow:
                    0 0 0 6px #08030f,
                    0 0 60px rgba(245, 197, 66, 0.35);
            }
            .inside {
                position: absolute;
                left: 22px;
                right: 22px;
                top: 22px;
                bottom: 0;
                border-radius: 140px 140px 0 0;
                overflow: hidden;
            }
            .inside canvas,
            .inside svg {
                position: absolute;
            }
            /* the door leaf, swung open a crack: a skewed panel on the left */
            .leaf {
                position: absolute;
                left: 22px;
                top: 22px;
                bottom: 0;
                width: 150px;
                border-radius: 140px 0 0 0;
                transform-origin: left center;
                transform: perspective(900px) rotateY(58deg);
                background: linear-gradient(90deg, #7a1f9a, #4a1060);
                box-shadow:
                    inset 0 0 0 8px #2a0838,
                    10px 0 30px rgba(0, 0, 0, 0.6);
            }
            .num {
                position: absolute;
                left: 0;
                right: 0;
                top: -84px;
                text-align: center;
                font-size: 90px;
                line-height: 1;
                color: #f5c542;
                text-shadow: 6px 6px 0 #08030f;
            }
            .lab {
                position: absolute;
                left: -20px;
                right: -20px;
                top: 650px;
                text-align: center;
                font-size: 60px;
                line-height: 0.9;
                text-shadow: 5px 5px 0 #08030f;
            }
            #d1 {
                left: 45px;
            }
            #d2 {
                left: 435px;
            }
            #d3 {
                left: 825px;
            }
            #d1 .inside {
                background: radial-gradient(circle at 60% 60%, #0e4a7a, #061a33 75%);
            }
            #d2 .inside {
                background: radial-gradient(circle at 60% 60%, #1a2a4a, #05080f 75%);
            }
            #d3 .inside {
                background: radial-gradient(circle at 60% 60%, #3a2a08, #120a02 75%);
            }
            .small {
                position: absolute;
                left: 0;
                right: 0;
                top: 1420px;
                text-align: center;
                font:
                    400 23px/1 'JetBrains Mono',
                    monospace;
                letter-spacing: 0.12em;
                color: #e8d9f4;
            }
        </style>
    </head>
    <body>
        <div class="stage"></div>
        <div class="floor"></div>
        <div class="top">
            <div class="brand"><canvas id="mark"></canvas>BEARPROOF</div>
            <div class="pill">VOTE · BUILD #26</div>
        </div>
        <h1>PICK<br /><span>A DOOR.</span></h1>
        <div class="door" id="d1">
            <div class="num">1</div>
            <div class="frame"></div>
            <div class="inside" id="i1"></div>
            <div class="leaf"></div>
            <div class="lab">PLAY AS<br />THE WHALE</div>
        </div>
        <div class="door" id="d2">
            <div class="num">2</div>
            <div class="frame"></div>
            <div class="inside" id="i2"><canvas id="snow" width="286" height="598"></canvas></div>
            <div class="leaf"></div>
            <div class="lab">CRYPTO<br />WINTER NIGHT</div>
        </div>
        <div class="door" id="d3">
            <div class="num">3</div>
            <div class="frame"></div>
            <div class="inside" id="i3">
                <svg
                    width="200"
                    height="250"
                    viewBox="0 0 20 25"
                    shape-rendering="crispEdges"
                    style="left: 66px; top: 200px"
                    id="list"
                ></svg>
            </div>
            <div class="leaf"></div>
            <div class="lab">MISSIONS</div>
        </div>
        <div class="small">HOLDERS VOTE · CLOSES 21:00 UTC · NOT IN THE GAME YET</div>
        <script type="module">
            import { put } from '/scripts/og/x/x.js';
            const $ = (id) => document.getElementById(id);
            await document.fonts.ready;
            await Promise.all(
                ["40px 'Jersey 10'", "40px 'JetBrains Mono'"].map((f) => document.fonts.load(f))
            );
            put($('mark'), 'emblem', 2000, { max: 4, glow: false });
            const add = (host, id, x, y, max) => {
                const c = document.createElement('canvas');
                put(c, id, 2000, { max, glow: false });
                c.style.left = x - c.width / 2 + 'px';
                c.style.top = y - c.height / 2 + 'px';
                host.append(c);
            };
            add($('i1'), 'whale', 180, 330, 7);
            // door 2: falling snow over a dark street, one frozen candle glowing
            const s = $('snow').getContext('2d');
            let seed = 26;
            const rnd = () => (seed = (seed * 16807) % 2147483647) / 2147483647;
            s.fillStyle = 'rgba(160,220,255,0.12)';
            s.fillRect(0, 470, 286, 128);
            for (let i = 0; i < 120; i++) {
                const z = rnd() < 0.2 ? 6 : 3;
                s.fillStyle = `rgba(230,245,255,${0.4 + rnd() * 0.6})`;
                s.fillRect(Math.round(rnd() * 286), Math.round(rnd() * 598), z, z);
            }
            add($('i2'), 'xp_candle_big', 180, 360, 9);
            s.fillStyle = 'rgba(127,212,255,0.35)';
            s.beginPath();
            s.arc(180 - 22, 360 - 22, 90, 0, Math.PI * 2);
            s.fill();
            // door 3: a checklist, two ticked
            const rows = [
                '....................',
                '.wwwwwwwwwwwwwwwwww.',
                '.w................w.',
                '.w.gg..kkkkkkkkk..w.',
                '.w.gg.............w.',
                '.w................w.',
                '.w.gg..kkkkkkk....w.',
                '.w.gg.............w.',
                '.w................w.',
                '.w.oo..kkkkkkkkkk.w.',
                '.w.oo.............w.',
                '.w................w.',
                '.w.oo..kkkkkk.....w.',
                '.w.oo.............w.',
                '.w................w.',
                '.w..........yyyy..w.',
                '.w.........yyyyyy.w.',
                '.w..........yyyy..w.',
                '.w................w.',
                '.wwwwwwwwwwwwwwwwww.',
                '....................'
            ];
            const pal = { w: '#f4f8fb', g: '#16e08a', o: '#5b667c', k: '#b8c4d2', y: '#f5c542' };
            let h = '<rect x="1" y="1" width="18" height="19" fill="#2a1f10" />';
            rows.forEach((r, y) =>
                [...r].forEach((ch, x) => {
                    if (pal[ch])
                        h += `<rect x="${x}" y="${y}" width="1" height="1" fill="${pal[ch]}" />`;
                })
            );
            $('list').innerHTML = h;
            window.ready = true;
        </script>
    </body>
</html>
