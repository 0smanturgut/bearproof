name: Anthropic key check

# Operator diagnostic: says what kind of key ANTHROPIC_API_KEY is (its public prefix), how long it is, whether it
# has stray whitespace, what the API answers, and whether the Build Agent's models work. Never prints the key.

on:
    workflow_dispatch:

permissions:
    contents: read

jobs:
    check:
        runs-on: ubuntu-latest
        timeout-minutes: 5
        steps:
            - env:
                  KEY: ${{ secrets.ANTHROPIC_API_KEY }}
              run: |
                  case "$KEY" in
                    sk-ant-api*) KIND="API key (sk-ant-api…)" ;;
                    sk-ant-admin*) KIND="ADMIN key (sk-ant-admin…): cannot call the Messages API" ;;
                    sk-ant-oat*) KIND="OAuth/subscription token (sk-ant-oat…): not an API key" ;;
                    "") KIND="EMPTY" ;;
                    *) KIND="not an Anthropic API key (unexpected prefix)" ;;
                  esac
                  echo "kind: $KIND"
                  echo "length: ${#KEY}"
                  if printf '%s' "$KEY" | grep -q '[[:space:]]'; then echo "whitespace: YES (a space or newline was pasted with it)"; else echo "whitespace: none"; fi
                  CODE=$(curl -s -o /tmp/r.json -w '%{http_code}' https://api.anthropic.com/v1/models -H "x-api-key: $KEY" -H 'anthropic-version: 2023-06-01')
                  echo "GET /v1/models -> HTTP $CODE"
                  node -e "try{const d=require('/tmp/r.json');console.log(d.error?('error: '+d.error.type+': '+d.error.message):('ok: '+(d.data||[]).length+' models visible'))}catch{console.log('no JSON')}"
                  node -e "try{const d=require('/tmp/r.json');console.log('opus models: '+(d.data||[]).map(m=>m.id).filter(i=>/opus/.test(i)).join(', '))}catch{}"
                  for M in claude-opus-5-5 claude-opus-5; do
                    CODE=$(curl -s -o /tmp/m.json -w '%{http_code}' https://api.anthropic.com/v1/messages -H "x-api-key: $KEY" -H 'anthropic-version: 2023-06-01' -H 'content-type: application/json' -d "{\"model\":\"$M\",\"max_tokens\":16,\"messages\":[{\"role\":\"user\",\"content\":\"Reply with the word ok.\"}]}")
                    echo "POST /v1/messages model=$M -> HTTP $CODE $(node -e "try{const d=require('/tmp/m.json');console.log(d.error?d.error.type+': '+d.error.message:'model '+d.model+' said: '+(d.content||[]).map(c=>c.text).join(''))}catch{console.log('no JSON')}")"
                  done
            - name: Claude Code CLI with Opus 5.5
              env:
                  ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
              run: |
                  npx -y @anthropic-ai/claude-code@latest --version
                  npx -y @anthropic-ai/claude-code@latest -p "Reply with the word ok and nothing else." --model claude-opus-5-5 --max-turns 1 --output-format json \
                    | node -e "let s='';process.stdin.on('data',c=>s+=c).on('end',()=>{try{const d=JSON.parse(s);console.log('cli result:',d.is_error?'ERROR':'ok','|',String(d.result).slice(0,40),'| models:',Object.keys(d.modelUsage||{}).join(','),'| cost $'+d.total_cost_usd)}catch(e){console.log('cli output not JSON:',s.slice(0,200))}})"
            - name: Live feed token (an empty POST, stores nothing)
              env:
                  INGEST_TOKEN: ${{ secrets.INGEST_TOKEN }}
              run: |
                  echo "INGEST_TOKEN length: ${#INGEST_TOKEN}"
                  CODE=$(curl -s -o /tmp/i.json -w '%{http_code}' -X POST https://bearproof.app/api/internal/agent/events \
                    -H "authorization: Bearer $INGEST_TOKEN" -H 'content-type: application/json' -d '{"run":"token-check","events":[]}')
                  echo "POST /api/internal/agent/events (no events) -> HTTP $CODE $(cat /tmp/i.json)"
