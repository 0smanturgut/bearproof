name: Deploy

# Every push to main or of a build tag: run the gates, assemble dist/ from main plus every build tag, deploy.
# A build tag is cut here only for the Build Agent's merge (commit trailer `Build-Mode: agent`), for the next
# 00:00 UTC. Bootstrap and human builds are cut by hand with `node scripts/release.mjs` and pushed as tags.
# The Build Agent cannot edit this file (GITHUB_TOKEN can't change workflows, and scripts/guard-paths.mjs refuses it).

on:
    push:
        branches: [main]
        tags: ['build-*']
    workflow_dispatch:

permissions:
    contents: write # push build-<n> tags

concurrency:
    group: deploy
    cancel-in-progress: false

jobs:
    deploy:
        runs-on: ubuntu-latest
        timeout-minutes: 30
        env:
            CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
            CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
            SITE: https://bearproof.app
        steps:
            - name: Check credentials
              run: |
                  if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
                    echo "::notice::CLOUDFLARE_API_TOKEN is not set: deploys run from the operator's machine until it is."
                    echo "PAUSED=1" >> "$GITHUB_ENV"
                  fi
            - uses: actions/checkout@v4
              with:
                  ref: main # a tag push still deploys the current Worker and HQ, never an older commit
                  fetch-depth: 0
            - uses: actions/setup-node@v4
              with:
                  node-version: '22'
                  cache: 'npm'
            - run: npm ci
            - run: npx playwright install --with-deps chromium
            - name: Gates
              run: |
                  npm run check
                  node game/scripts/smoke.mjs --out "$RUNNER_TEMP/smoke"
                  node game/scripts/determinism.mjs --engines chromium --seeds 3
            - name: Cut the Build Agent's build (next 00:00 UTC)
              if: env.PAUSED != '1'
              run: |
                  git config user.name "release-bot"
                  git config user.email "release@bearproof.invalid"
                  MODE=$(git log -1 --format=%B | sed -n 's/^Build-Mode: *//p' | head -1)
                  if [ "$MODE" = "agent" ]; then
                    node scripts/release.mjs --push --mode agent
                  else
                    echo "Not an agent merge (Build-Mode: ${MODE:-none}); no build cut."
                  fi
            - run: npm run build
              if: env.PAUSED != '1'
            - run: npx wrangler d1 migrations apply bearproof-db --remote
              if: env.PAUSED != '1'
            - run: npx wrangler deploy
              if: env.PAUSED != '1'
            - name: Live check
              if: env.PAUSED != '1'
              run: |
                  curl -fsS "$SITE/api/health"
                  curl -fsS -o /dev/null -w "%{http_code} /play -> %{redirect_url}\n" "$SITE/play"
            - uses: actions/upload-artifact@v4
              if: always()
              with:
                  name: smoke-screenshots
                  path: ${{ runner.temp }}/smoke
