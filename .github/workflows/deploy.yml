name: Deploy

# Every push to main: run the gates, cut a build tag if game/ changed, assemble dist/ and deploy the Worker.
# The Build Agent cannot edit this file (GITHUB_TOKEN can't change workflows, and scripts/guard-paths.mjs refuses it).

on:
    push:
        branches: [main]
    workflow_dispatch:
        inputs:
            activate_now:
                description: 'Activate a new build immediately instead of at the next 00:00 UTC'
                type: boolean
                default: false

permissions:
    contents: write # push build-<n> tags

concurrency:
    group: deploy
    cancel-in-progress: false

jobs:
    deploy:
        runs-on: ubuntu-latest
        timeout-minutes: 30
        env:
            CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
            CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
            SITE: https://bearproof.app
        steps:
            - uses: actions/checkout@v4
              with:
                  fetch-depth: 0
            - uses: actions/setup-node@v7
              with:
                  node-version: '22'
                  cache: 'npm'
            - run: npm ci
            - run: npx playwright install --with-deps chromium
            - name: Gates
              run: |
                  npm run check
                  node game/scripts/smoke.mjs --out "$RUNNER_TEMP/smoke"
                  node game/scripts/determinism.mjs --engines chromium --seeds 3
            - name: Cut a build if game/ changed
              run: |
                  git config user.name "release-bot"
                  git config user.email "release@bearproof.invalid"
                  MODE=$(git log -1 --format=%B | sed -n 's/^Build-Mode: *//p' | head -1)
                  FLAGS="--push"
                  if [ "${{ inputs.activate_now }}" = "true" ] || [ "$MODE" = "bootstrap" ]; then FLAGS="$FLAGS --now"; fi
                  node scripts/release.mjs $FLAGS ${MODE:+--mode $MODE}
            - run: npm run build
            - run: npx wrangler d1 migrations apply bearproof-db --remote
            - run: npx wrangler deploy
            - name: Live check
              run: |
                  curl -fsS "$SITE/api/health"
                  curl -fsS -o /dev/null -w "%{http_code} /play -> %{redirect_url}\n" "$SITE/play"
            - uses: actions/upload-artifact@v4
              if: always()
              with:
                  name: smoke-screenshots
                  path: ${{ runner.temp }}/smoke
